<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#120b2e">
<title>Buzz Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: één scherm, geen scroll. Host = studio (vraag midden, kandidaten achter podia onderin). Controller = duimbereik. */
:root{
  --bg:#120b2e; --panel:#1d1446; --panel2:#271b5c; --line:#3b2d7a;
  --fg:#f6f1ff; --muted:#a899d6; --accent:#ff3d8a;
  --b0:#2f7bff; --b1:#ff7a1a; --b2:#2ecc71; --b3:#ffd400; --buzz:#ff2d2d;
  --ok:#2ecc71; --bad:#ff5252;
  --display:'Bungee','Impact',sans-serif; --body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-weight:600;-webkit-tap-highlight-color:transparent;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--b3);outline-offset:2px}
input{font:inherit;font-weight:800;color:var(--fg);background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:14px 16px;width:100%}
.btn{background:var(--accent);color:#fff;font-family:var(--display);font-size:1.1rem;padding:16px 28px;border-radius:14px;box-shadow:0 6px 0 #a3104f;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a3104f}
.btn.ghost{background:var(--panel2);box-shadow:0 6px 0 #0d0822}
.btn.ghost:active{box-shadow:0 2px 0 #0d0822}
.btn.sm{font-size:.85rem;padding:10px 14px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.on{outline:3px solid var(--b3)}
.muted{color:var(--muted)}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding-block:24px;overflow:auto}
.stack{display:flex;flex-direction:column;gap:14px;width:min(100%,420px)}
.logo{font-family:var(--display);font-size:clamp(2.6rem,9vw,5rem);line-height:1;color:var(--b3);text-shadow:0 .06em 0 var(--accent)}
.logo small{display:block;font-size:.3em;color:var(--fg);text-shadow:none;letter-spacing:.3em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.chip{background:var(--panel2);border-radius:999px;padding:8px 14px;font-weight:800;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.code{font-family:var(--display);font-size:clamp(3rem,14vw,7rem);letter-spacing:.12em;line-height:1;color:var(--b3)}
.qr{background:#fff;padding:10px;border-radius:12px;display:inline-block}
.qr img,.qr canvas{display:block}
label.opt{display:flex;gap:10px;align-items:center;background:var(--panel2);padding:10px 14px;border-radius:12px;text-align:left}
label.opt input{width:22px;height:22px;accent-color:var(--accent)}
label.opt span{flex:1}
label.opt small{color:var(--muted)}
.err{color:var(--bad)}

/* Studio-achtergrond */
.stage-bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(ellipse at 50% 120%,#3a1670 0%,var(--bg) 60%)}
.stage-bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.stage-bg .beam{position:absolute;left:50%;top:-20%;width:18vw;height:160%;transform-origin:50% 0;background:linear-gradient(180deg,rgba(255,61,138,.28),rgba(255,61,138,0) 70%);filter:blur(18px);mix-blend-mode:screen;animation:sweep 9s ease-in-out infinite alternate}
.stage-bg .beam.b2{background:linear-gradient(180deg,rgba(255,212,0,.22),rgba(255,212,0,0) 70%);animation-duration:11s;animation-delay:-4s}
.stage-bg .beam.b3{background:linear-gradient(180deg,rgba(47,123,255,.22),rgba(47,123,255,0) 70%);animation-duration:13s;animation-delay:-8s}
@keyframes sweep{from{transform:translateX(-50%) rotate(-28deg)}to{transform:translateX(-50%) rotate(28deg)}}

/* Host */
.host{flex:1;min-height:0;display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding-block:12px}
.topbar{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center}
.topbar .rname{font-family:var(--display);font-size:1.1rem;color:var(--b3)}
.topbar .rname small{font-family:var(--body);color:var(--muted);font-weight:800;margin-left:10px;font-size:.8rem}
.topbar .qn{color:var(--muted);font-weight:800}
.timer{grid-column:1/-1;height:10px;background:var(--panel);border-radius:999px;overflow:hidden}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--b3));width:100%;transform-origin:left;transition:transform .25s linear}
.timer.hot i{background:linear-gradient(90deg,var(--buzz),var(--b1));animation:pulse .5s infinite alternate}
@keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.6)}}
.stage{display:grid;grid-template-rows:auto 1fr;gap:12px;min-height:0;animation:swoosh .6s cubic-bezier(.2,1.2,.4,1)}
@keyframes swoosh{from{transform:scale(1.08) translateX(40px);filter:blur(6px);opacity:0}to{transform:none;filter:none;opacity:1}}
.qcard{background:rgba(29,20,70,.92);border-radius:20px;padding:clamp(14px,2.5vw,28px);display:flex;flex-direction:column;gap:8px;justify-content:center;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:slideup .6s cubic-bezier(.2,1.3,.4,1)}
.qcard .cat{color:var(--accent);font-weight:900;letter-spacing:.15em;text-transform:uppercase;font-size:.8rem}
.qcard .q{font-size:clamp(1.3rem,3.2vw,2.3rem);font-weight:900;line-height:1.2}
.qcard.reading .q{animation:glow 1.4s ease-in-out infinite alternate}
@keyframes glow{from{text-shadow:0 0 0 rgba(255,212,0,0)}to{text-shadow:0 0 24px rgba(255,212,0,.5)}}
@keyframes slideup{from{transform:translateY(60px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:0;perspective:1200px}
@media (max-width:640px){.answers{grid-template-columns:1fr}}
.ans{border-radius:18px;padding:12px 18px;display:flex;align-items:center;gap:14px;font-size:clamp(1rem,2.2vw,1.6rem);font-weight:900;color:#0d0822;min-height:52px;transition:opacity .5s,transform .5s,filter .5s;animation:flipin .7s cubic-bezier(.2,1.2,.4,1) both}
.ans:nth-child(1){animation-delay:.05s}.ans:nth-child(2){animation-delay:.2s}.ans:nth-child(3){animation-delay:.35s}.ans:nth-child(4){animation-delay:.5s}
@keyframes flipin{from{transform:rotateX(-90deg) translateY(20px);opacity:0}to{transform:none;opacity:1}}
.ans .k{font-family:var(--display);font-size:1.2em;opacity:.8}
.ans.c0{background:var(--b0);color:#fff}.ans.c1{background:var(--b1)}.ans.c2{background:var(--b2);color:#0b2e1a}.ans.c3{background:var(--b3)}
.ans.dim{opacity:.18;transform:scale(.94) rotateX(25deg);filter:grayscale(.6);animation:none}
.ans.hit{outline:6px solid #fff;animation:hit .9s cubic-bezier(.2,1.5,.4,1) both;box-shadow:0 0 60px rgba(255,255,255,.5)}
@keyframes hit{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1.04)}}
.ranklist{display:grid;gap:8px;align-content:center}
.ranklist .ri{background:var(--panel2);border-radius:14px;padding:12px 18px;font-weight:900;font-size:clamp(1rem,2vw,1.5rem);display:flex;gap:14px;align-items:center;animation:flipin .6s both}
.ranklist .ri .k{font-family:var(--display);color:var(--b3);min-width:1.4em}
.ranklist .ri.ok{background:#1e7a45}.ranklist .ri.nope{opacity:.5}
.buzzstage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(29,20,70,.9);border-radius:20px;padding:16px;text-align:center;animation:slideup .5s cubic-bezier(.2,1.3,.4,1);min-height:0}
.buzzstage .big{font-family:var(--display);font-size:clamp(1.6rem,5vw,3.2rem);color:var(--b3)}
.buzzstage .big.slam{animation:slam .6s cubic-bezier(.2,1.6,.3,1) both;color:#fff;text-shadow:0 0 40px var(--buzz)}
@keyframes slam{0%{transform:scale(4);opacity:0}60%{transform:scale(.92);opacity:1}80%{transform:scale(1.06) rotate(-1deg)}100%{transform:scale(1)}}
.buzzstage .ring{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7b7b,var(--buzz) 60%,#9c0a0a);box-shadow:0 0 0 0 rgba(255,45,45,.6);animation:ring 1.2s ease-out infinite}
@keyframes ring{to{box-shadow:0 0 0 40px rgba(255,45,45,0)}}
.buzzstage img.closeup{height:min(34vh,260px);animation:pop .5s cubic-bezier(.2,1.6,.4,1);filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))}
.chanpick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:center}
.chan{border-radius:16px;padding:14px;font-family:var(--display);font-size:clamp(.9rem,1.8vw,1.3rem);text-align:center;color:#0d0822;animation:flipin .6s both}
.chan.pick{outline:5px solid #fff;animation:hit .8s both}
/* Podia met kandidaten */
.podia{display:flex;gap:6px;align-items:flex-end;justify-content:center;padding-top:calc(var(--ah,120px) * .55);min-height:0}
.pod{flex:1 1 0;max-width:150px;min-width:0;position:relative;text-align:center;transition:transform .3s}
.pod .av{height:var(--ah,120px);display:block;margin:0 auto -8px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6));transform-origin:bottom center;transition:transform .3s,filter .3s;position:relative;z-index:1}
.pod .desk{background:linear-gradient(180deg,#5a2fb5,#2a1760);border-radius:10px 10px 4px 4px;border-top:4px solid var(--accent);padding:6px 6px 8px;position:relative;z-index:2;box-shadow:0 10px 20px rgba(0,0,0,.4)}
.pod .n{font-weight:900;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .s{font-family:var(--display);font-size:1.1rem;font-variant-numeric:tabular-nums}
.pod.answered .desk{border-top-color:var(--muted)}
.pod.answered .av{animation:nod .5s}
@keyframes nod{30%{transform:translateY(-10px)}}
.pod.buzzed .av{transform:scale(1.15);filter:drop-shadow(0 0 24px var(--buzz))}
.pod.buzzed .desk{border-top-color:var(--buzz);box-shadow:0 0 30px rgba(255,45,45,.5)}
.pod.correct .av{animation:jump .9s cubic-bezier(.2,1.4,.4,1)}
@keyframes jump{0%{transform:none}30%{transform:translateY(-34px) scale(1.08)}60%{transform:translateY(0) scale(.96)}80%{transform:translateY(-10px)}100%{transform:none}}
.pod.correct .desk{border-top-color:var(--ok);box-shadow:0 0 24px rgba(46,204,113,.45)}
.pod.wrong .av{transform:rotate(-8deg) translateY(6px);filter:grayscale(.7) brightness(.7)}
.pod.wrong .desk{border-top-color:var(--bad)}
.pod.none .av{filter:brightness(.6)}
.pod.offline{opacity:.4}
.pod.holder .av{animation:shiver .25s infinite}
@keyframes shiver{0%{transform:translateX(-2px) rotate(-1deg)}100%{transform:translateX(2px) rotate(1deg)}}
.pod .bomb{position:absolute;left:50%;top:-26px;transform:translateX(-50%);font-size:1.6rem;z-index:3;width:48px;height:48px;border-radius:50%;background:var(--b3);display:grid;place-items:center;box-shadow:0 0 24px var(--b3),0 0 0 4px rgba(255,255,255,.5);animation:bob .6s infinite alternate}
@keyframes bob{from{transform:translateX(-50%) translateY(0)}to{transform:translateX(-50%) translateY(-8px)}}
.pod .bet{position:absolute;right:4px;top:-10px;z-index:3;background:var(--b3);color:#0d0822;font-family:var(--display);font-size:.8rem;padding:2px 8px;border-radius:8px;animation:popup .5s both}
.pod .d{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-family:var(--display);font-size:1rem;padding:2px 8px;border-radius:8px;background:var(--ok);color:#06291a;animation:popup .7s cubic-bezier(.2,1.6,.4,1) both;z-index:3}
.pod .d.neg{background:var(--bad);color:#fff}
.pod .splat{position:absolute;left:50%;top:10%;width:70%;aspect-ratio:1;transform:translateX(-50%);z-index:4;pointer-events:none;background:radial-gradient(circle,#fff8e1 0 28%,#f3d58a 29% 40%,transparent 41%),radial-gradient(circle at 30% 30%,#fff 0 12%,transparent 13%),radial-gradient(circle at 70% 60%,#fff 0 14%,transparent 15%),radial-gradient(circle at 50% 80%,#fff 0 10%,transparent 11%);animation:splat .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes splat{from{transform:translateX(-50%) scale(0) rotate(-40deg)}to{transform:translateX(-50%) scale(1)}}
.pie-fly{position:fixed;z-index:9;font-size:3rem;pointer-events:none;transition:transform .7s cubic-bezier(.3,.1,.3,1),opacity .2s .6s;transform:translate(0,0)}
@keyframes popup{from{transform:translateY(16px) scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.hostctl{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hostctl .hint{color:var(--muted);font-size:.9rem}
.overlay{position:fixed;inset:0;background:rgba(18,11,46,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;z-index:5;animation:fade .5s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.overlay h1{font-size:clamp(2rem,7vw,4.5rem);color:var(--b3)}
.overlay h1.title{animation:titlein 1s cubic-bezier(.2,1.4,.3,1) both;text-shadow:0 .05em 0 var(--accent),0 0 40px rgba(255,212,0,.4)}
@keyframes titlein{0%{transform:scale(.2) rotate(-6deg);opacity:0;letter-spacing:.6em}70%{transform:scale(1.08);opacity:1;letter-spacing:.02em}100%{transform:scale(1)}}
.overlay p{max-width:40ch;font-size:1.15rem;margin:0;animation:fade .8s .6s both}
.count{font-family:var(--display);font-size:clamp(4rem,16vw,10rem);color:#fff;line-height:1;animation:countin .9s ease-out both}
@keyframes countin{0%{transform:scale(2.4);opacity:0}30%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:.2}}
.board{display:grid;gap:8px;width:min(100%,520px);position:relative}
.board .r{display:grid;grid-template-columns:2.2rem 44px 1fr auto;gap:12px;align-items:center;background:var(--panel);padding:8px 16px;border-radius:12px;font-size:1.15rem;font-weight:900;font-variant-numeric:tabular-nums;text-align:left;transition:transform .9s cubic-bezier(.2,1.1,.3,1),background .5s}
.board .r img{height:44px;width:44px;object-fit:contain;object-position:top}
.board .r.top{background:var(--accent)}
.board .r.up .sc{color:var(--ok)}.board .r.down .sc{color:var(--bad)}
.board .r .pos{font-family:var(--display)}
.board .r .sc{font-family:var(--display)}
.podium{display:flex;align-items:flex-end;gap:12px;justify-content:center;height:300px}
.podium div{width:130px;background:var(--panel2);border-radius:12px 12px 0 0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:10px;gap:4px;font-weight:900;transform-origin:bottom;transform:scaleY(0);opacity:0;transition:transform .9s cubic-bezier(.2,1.3,.4,1),opacity .3s;position:relative}
.podium div img{height:120px;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))}
.podium div.show{opacity:1;transform:none}
.podium .p1{height:150px;background:var(--b3);color:#0d0822}.podium .p2{height:110px}.podium .p3{height:80px}
.podium b{font-family:var(--display);font-size:1.5rem}
.flash{position:fixed;inset:0;z-index:6;pointer-events:none;background:var(--buzz);animation:flashout .7s ease-out both}
.flash.white{background:#fff}
@keyframes flashout{from{opacity:.85}to{opacity:0}}
.shake{animation:shake .5s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.vidover{position:fixed;inset:0;z-index:7;background:#000;display:flex;align-items:center;justify-content:center}
.vidover video{width:100%;height:100%;object-fit:cover}
#confetti{position:fixed;inset:0;z-index:8;pointer-events:none}
.winner{font-size:clamp(2.4rem,9vw,6rem)!important;animation:titlein 1.2s cubic-bezier(.2,1.4,.3,1) both}
.lobbyav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:flex-end}
.lobbyav div{text-align:center;font-size:.8rem;font-weight:900;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.lobbyav img{height:110px;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}

/* Controller */
.ctl{flex:1;min-height:0;display:grid;grid-template-rows:auto 1fr;gap:12px;padding-block:12px}
.ctl .hdr{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border-radius:12px;padding:8px 14px;gap:10px}
.ctl .hdr img{height:44px}
.ctl .hdr b{font-family:var(--display);font-size:1.2rem;font-variant-numeric:tabular-nums}
.ctl .hdr .st{font-size:.75rem;color:var(--muted)}
.ctl .hdr .st.on{color:var(--ok)}
.ctl .body{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.ctl .msg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:10px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.ctl .msg h2{font-size:clamp(1.5rem,7vw,2.4rem)}
.ctl .msg .delta{font-family:var(--display);font-size:3rem;color:var(--ok);animation:popup .6s cubic-bezier(.2,1.6,.4,1) both}
.ctl .msg .delta.neg{color:var(--bad)}
.ctl .qtext{background:var(--panel);border-radius:14px;padding:12px;text-align:center;font-weight:900;font-size:1.05rem;animation:slideup .4s cubic-bezier(.2,1.3,.4,1)}
.pad{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;flex:1;min-height:0}
.pad button{border-radius:20px;font-size:1.05rem;font-weight:900;color:#0d0822;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.18);transition:transform .08s;animation:flipin .5s cubic-bezier(.2,1.2,.4,1) both}
.pad button:nth-child(2){animation-delay:.08s}.pad button:nth-child(3){animation-delay:.16s}.pad button:nth-child(4){animation-delay:.24s}
.pad button:active{transform:scale(.96)}
.pad button[disabled]{opacity:.35}
.pad .c0{background:var(--b0);color:#fff}.pad .c1{background:var(--b1)}.pad .c2{background:var(--b2)}.pad .c3{background:var(--b3)}
.pad button .k{font-family:var(--display);font-size:1.6rem;opacity:.75}
.buzzer{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.buzzer button{width:min(78vw,340px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7b7b,var(--buzz) 60%,#9c0a0a);box-shadow:0 18px 0 #6b0000,0 30px 40px rgba(0,0,0,.5);font-family:var(--display);font-size:2.4rem;color:#fff;text-shadow:0 3px 0 #7a0000;transition:transform .06s,box-shadow .06s;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.buzzer button:active{transform:translateY(14px);box-shadow:0 4px 0 #6b0000,0 10px 20px rgba(0,0,0,.5)}
.buzzer button[disabled]{filter:grayscale(.8);opacity:.5}
.ctimer{height:8px;background:var(--panel);border-radius:999px;overflow:hidden}
.ctimer i{display:block;height:100%;background:var(--accent);transform-origin:left}
.chargrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chargrid button{background:var(--panel2);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;font-weight:900;animation:pop .4s both}
.chargrid button img{height:84px}
.chargrid button[disabled]{opacity:.3;filter:grayscale(1)}
.chargrid button.me{outline:3px solid var(--b3)}
.list{display:grid;gap:10px}
.list button{background:var(--panel2);border-radius:14px;padding:14px;font-weight:900;display:flex;align-items:center;gap:12px;text-align:left;animation:flipin .5s both}
.list button img{height:44px}
.list button.sel{outline:3px solid var(--b3);background:#3a2585}
.list button .k{font-family:var(--display);color:var(--b3);min-width:1.4em;font-size:1.2rem}
.list button[disabled]{opacity:.4}
.bets{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

body.bad-flash{animation:badflash .6s}
@keyframes okflash{0%{background:#1e7a45}100%{background:var(--bg)}}
@keyframes badflash{0%{background:#8a1c1c}100%{background:var(--bg)}}

/* v4: Buzz-layout (opties links, kandidaten midden, scorebord rechts), presentator, torens */
.stage3{display:grid;grid-template-columns:minmax(200px,26%) 1fr minmax(190px,21%);gap:12px;min-height:0;animation:swoosh .6s cubic-bezier(.2,1.2,.4,1)}
.stage3>*{min-width:0;min-height:0}

.optlist .ans{min-height:0;padding:10px 14px;font-size:clamp(.95rem,1.6vw,1.3rem);border-radius:14px}

.mid .pslot.on{width:min(22vw,24vh)}
.mid .podia{padding-top:calc(var(--ah,120px) * .5)}
.mid .focus{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;min-height:0}
.scoreboard{display:flex;flex-direction:column;gap:6px;justify-content:center;position:relative}
.sb{display:grid;grid-template-columns:40px 1fr auto 28px;gap:8px;align-items:center;background:rgba(29,20,70,.92);border:2px solid transparent;border-radius:12px;padding:4px 8px 4px 4px;transition:transform .8s cubic-bezier(.2,1.1,.3,1),border-color .3s,box-shadow .3s;font-variant-numeric:tabular-nums}
.sb img{height:40px;width:40px;object-fit:contain;object-position:top;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.sb .n{font-weight:900;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb .s{font-family:var(--display);font-size:1rem}
.sb .m{font-family:var(--display);font-size:1.1rem;text-align:center}
.sb.answered{border-color:var(--muted)}.sb.correct{border-color:var(--ok);box-shadow:0 0 16px rgba(46,204,113,.4)}.sb.wrong{border-color:var(--bad)}.sb.buzzed{border-color:var(--buzz)}
.sb.top .n{color:var(--b3)}.sb.offline{opacity:.4}.sb.out{opacity:.35;filter:grayscale(1)}
.presenter{position:fixed;z-index:6;pointer-events:none;transition:opacity .4s,transform .4s;transform-origin:bottom center}
.presenter.off{opacity:0;transform:translateY(40px) scale(.9)}
.presenter img{height:100%;display:block;filter:drop-shadow(0 12px 24px rgba(0,0,0,.6));transform-origin:bottom center}
.presenter.big{height:min(60vh,520px);left:6vw;bottom:8vh}
.presenter .bubble{position:absolute;left:70%;top:6%;background:#fff;color:#0d0822;font-weight:900;padding:10px 14px;border-radius:16px;max-width:30ch;font-size:1rem;box-shadow:0 8px 20px rgba(0,0,0,.4);animation:pop .3s both;pointer-events:none}
.presenter .bubble::before{content:'';position:absolute;left:-10px;top:24px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.towers{display:flex;gap:12px;align-items:flex-end;justify-content:center;height:100%;padding:0 8px;--maxh:min(42vh,340px)}
.tower{flex:1 1 0;max-width:150px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.tower .pillar{width:72%;background:repeating-linear-gradient(0deg,#2f7bff 0 8px,#163a86 8px 12px);border:3px solid #7fb0ff;border-bottom:0;border-radius:8px 8px 0 0;box-shadow:0 0 24px rgba(47,123,255,.5);transition:height 1s cubic-bezier(.2,1.1,.3,1);display:flex;align-items:flex-start;justify-content:center}

.tower .lbl{font-family:var(--display);font-size:.9rem;margin-top:4px}
.tower.out .av{filter:grayscale(1) brightness(.5);transform:translateY(20px) rotate(12deg)}
.tower.out .pillar{background:#333;border-color:#555;box-shadow:none}
.tower.out .lbl{color:var(--bad)}
.tower .d{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-family:var(--display);padding:2px 8px;border-radius:8px;background:var(--ok);color:#06291a;animation:popup .7s both;z-index:3}
.tower .d.neg{background:var(--bad);color:#fff}
.titlewall{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,rgba(120,30,90,1),rgba(18,11,46,1) 65%);animation:fade .4s both}

function tone(f,t,type='sine',g=.25,at=0){if(!AC||!soundOn)return;const o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.value=f;v.gain.value=0;o.connect(v);v.connect(AC.destination);const s=AC.currentTime+at;v.gain.setValueAtTime(0,s);v.gain.linearRampToValueAtTime(g,s+.01);v.gain.exponentialRampToValueAtTime(.001,s+t);o.start(s);o.stop(s+t+.05)}

function confetti(ms=6000){const c=document.createElement('canvas');c.id='confetti';document.body.appendChild(c);const x=c.getContext('2d');const W=c.width=innerWidth,H=c.height=innerHeight;const cols=['#ff3d8a','#ffd400','#2f7bff','#2ecc71','#ff7a1a','#fff'];const P=Array.from({length:220},()=>({x:Math.random()*W,y:-20-Math.random()*H,vx:(Math.random()-.5)*2,vy:2+Math.random()*4,r:4+Math.random()*6,c:cols[Math.random()*cols.length|0],a:Math.random()*6,va:(Math.random()-.5)*.3}));const t0=Date.now();(function f(){x.clearRect(0,0,W,H);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;if(p.y>H+20){p.y=-20;p.x=Math.random()*W}x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(Date.now()-t0<ms)requestAnimationFrame(f);else c.remove()})()}

    clearInterval(this.fuseTimer);this.fuseTimer=setInterval(()=>{if(S.phase!=='bombq'&&S.phase!=='reading')return;const r=S.bomb.fuseEnd-Date.now();if(r<6000)SFX.fuse();if(r<=0){clearInterval(this.fuseTimer);this.explode()}},300);
    this.bombQ();
  },
  async bombQ(){
    const S=this.S,run=++this.run;S.bomb.qn++;S.cur=this.pickQ();S.answers={};S.correct=null;Object.values(S.players).forEach(p=>{p.status=p.id===S.bomb.holder?'holder':'idle'});
    S.phase='bombq';this.render();this.push();
    await Voice.say('q_'+S.cur.v,S.cur.q);if(run!==this.run)return;
    this.startTimer(ROUNDS.bomb.time,()=>this.judgeBomb(-1));
  },
  judgeBomb(c){
    const S=this.S;if(S.phase!=='bombq')return;this.run++;this.stopTimer();const h=S.players[S.bomb.holder];
    if(c===S.cur.c){SFX.correct();Voice.say('bomb_pass');const on=this.online().sort((a,b)=>a.order-b.order);const i=on.findIndex(p=>p.id===h.id);const nxt=on[(i+1)%on.length];if(nxt&&nxt.id!==h.id)S.bomb.holder=nxt.id}
    else{SFX.wrong();Voice.say('bomb_stay')}
    if(S.bomb.fuseEnd-Date.now()<1500)return; // ontploft zo
    setTimeout(()=>{if(S.phase==='bombq')this.bombQ()},fastMode?300:1500);
  },
  async explode(){
    const S=this.S,run=++this.run;this.stopTimer();if(!S.bomb)return;const h=S.players[S.bomb.holder];
    Object.values(S.players).forEach(p=>{p.delta=0;p.status='none'});
    if(h){h.score-=300;h.delta=-300;h.status='wrong'}Object.values(S.players).forEach(p=>{if(p.online&&p!==h){p.score+=100;p.delta=100;p.status='correct'}});
    SFX.boom();flashScreen('white');app.classList.add('shake');setTimeout(()=>app.classList.remove('shake'),600);
    S.phase='reveal';S.correct=S.cur?.c??null;this.render({countFrom:true});this.push();
    await wait(1200);if(run!==this.run)return;
    await Voice.say('bomb_boom');if(run!==this.run)return;
    if(S.bomb.n<S.bomb.total){await wait(1500);if(run!==this.run)return;return this.startBomb()}
    if(!autoMode){this.render();return}
    await wait(1500);if(run!==this.run)return;this.enterScores();
  },
  /* --- tussenstand & podium --- */
  async enterScores(){
    const S=this.S,run=++this.run;S.phase='scores';clearInterval(this.fuseTimer);S.bomb=null;Object.values(S.players).forEach(p=>{p.delta=0;p.status='idle'});this.render();this.push();
    const last=S.roundIdx>=S.order.length-1;
    await wait(300);if(run!==this.run)return;
    await Voice.say(last?'final_intro':'scores');if(run!==this.run)return;
    await wait(1000);if(run!==this.run)return;
    this.flipBoard();await wait(1500);if(run!==this.run)return;
    if(!last&&Math.random()<.5){await Voice.say(rnd(['last','close']));if(run!==this.run)return}
    if(!autoMode)return;
    await wait(last?1500:3000);if(run!==this.run)return;
    this.next();
  },
  flipBoard(){
    const S=this.S,b=this.board(),rows=[...document.querySelectorAll('.board .r')];if(!rows.length)return;
    const before={};rows.forEach(r=>before[r.dataset.id]=r.getBoundingClientRect().top);
    const box=rows[0].parentElement;b.forEach((p,i)=>{const r=rows.find(x=>x.dataset.id===p.id);if(!r)return;box.appendChild(r);r.querySelector('.pos').textContent=i+1;r.classList.toggle('top',i===0);
      const from=S.roundStart[p.id]??p.score;if(p.score>from)r.classList.add('up');else if(p.score<from)r.classList.add('down');countUp(r.querySelector('.sc'),from,p.score,1200)});
    rows.forEach(r=>{const dy=before[r.dataset.id]-r.getBoundingClientRect().top;if(dy){r.style.transition='none';r.style.transform=`translateY(${dy}px)`;requestAnimationFrame(()=>{r.style.transition='';r.style.transform=''})}});
    SFX.whoosh();
  },
  async enterPodium(){
    const S=this.S,run=++this.run;S.phase='podium';this.render();this.push();
    const b=this.board(),el=n=>document.querySelector('.podium .p'+n);
    await wait(500);if(run!==this.run)return;
    if(b[2]){el(3)?.classList.add('show');SFX.flip();await wait(1400);if(run!==this.run)return}
    if(b[1]){el(2)?.classList.add('show');SFX.flip();await wait(1400);if(run!==this.run)return}
    await Voice.say('winner');if(run!==this.run)return;
    SFX.drum();await wait(fastMode?300:1800);if(run!==this.run)return;
    el(1)?.classList.add('show');const w=document.getElementById('winner');if(w){w.textContent='Winnaar: '+(b[0]?.name||'—');w.classList.add('winner')}
    SFX.fanfare();SFX.applause();confetti(8000);
    await wait(800);if(run!==this.run)return;
    await Voice.say('congrats');
  },
  /* --- render --- */
  ctl(label,hint){return `<div class="hostctl"><span class="hint">${hint||''}</span><span class="row"><button class="btn ghost sm" data-a="voice">${voiceOn?'🎙️ stem':'🎙️ uit'}</button><button class="btn ghost sm" data-a="sound">${soundOn?'🔊':'🔇'}</button><button class="btn ghost sm ${fastMode?'on':''}" data-a="fast">⏩ snel</button>${label?`<button class="btn" data-a="next">${label}</button>`:''}</span></div>`},
  pods(opts={}){const S=this.S,ps=Object.values(S.players).sort((a,b)=>a.order-b.order);const ah=ps.length<=4?150:ps.length<=6?130:ps.length<=8?110:90;
    return `<div class="podia" style="--ah:${ah}px">${ps.map(p=>`<div class="pod ${p.status} ${p.online?'':'offline'} ${S.bomb&&S.bomb.holder===p.id&&S.phase==='bombq'?'holder':''}" data-id="${p.id}">${S.bomb&&S.bomb.holder===p.id&&(S.phase==='bombq'||S.phase==='reading')?'<div class="bomb">💣</div>':''}${S.curType==='stakes'&&p.bet&&S.phase!=='reveal'?`<div class="bet">${p.bet}</div>`:''}${p.delta?`<div class="d ${p.delta<0?'neg':''}">${p.delta>0?'+':''}${p.delta}</div>`:''}<img class="av" src="${charImg(p.char)}" alt=""><div class="desk"><div class="n">${esc(p.name)}</div><div class="s" data-from="${opts.countFrom?p.score-p.delta:p.score}" data-to="${p.score}">${opts.countFrom?p.score-p.delta:p.score}</div></div></div>`).join('')}</div>`},
  renderPods(opts){const el=document.querySelector('.podia');if(el)el.outerHTML=this.pods(opts);else if(this.S.phase==='lobby')return this.render();this.renderScoreboard(opts);Presenter.place()},
  scoreboard(opts={}){const S=this.S,b=this.board();const mark=p=>p.status==='correct'?'<span class="m" style="color:var(--ok)">✓</span>':p.status==='wrong'?'<span class="m" style="color:var(--bad)">✗</span>':p.status==='answered'?'<span class="m" style="color:var(--muted)">●</span>':p.status==='buzzed'?'<span class="m">🔴</span>':(S.bomb&&S.bomb.holder===p.id&&S.phase==='bombq')?'<span class="m">💣</span>':(S.curType==='stakes'&&p.bet&&S.phase!=='reveal')?`<span class="m" style="font-size:.7rem;color:var(--b3)">${p.bet}</span>`:'<span class="m"></span>';
    return `<div class="scoreboard">${b.map((p,i)=>`<div class="sb ${p.status} ${i===0?'top':''} ${p.online?'':'offline'} ${p.out?'out':''}" data-id="${p.id}"><img src="${charImg(p.char)}" alt=""><div class="n">${esc(p.name)}</div><div class="s" data-from="${opts.countFrom?p.score-p.delta:p.score}" data-to="${p.score}">${opts.countFrom?p.score-p.delta:p.score}</div>${mark(p)}</div>`).join('')}</div>`},
  renderScoreboard(opts={}){const el=document.querySelector('.scoreboard');if(!el)return;const before={};el.querySelectorAll('.sb').forEach(r=>before[r.dataset.id]=r.getBoundingClientRect().top);el.outerHTML=this.scoreboard(opts);const n=document.querySelector('.scoreboard');n.querySelectorAll('.sb').forEach(r=>{const dy=(before[r.dataset.id]??r.getBoundingClientRect().top)-r.getBoundingClientRect().top;if(dy){r.style.transition='none';r.style.transform=`translateY(${dy}px)`;requestAnimationFrame(()=>{r.style.transition='';r.style.transform=''})}})},
  towers(opts={}){const S=this.S,ps=Object.values(S.players).sort((a,b)=>a.order-b.order);
    return `<div class="towers">${ps.map(p=>`<div class="tower ${p.out?'out':''} ${p.status}" data-id="${p.id}">${p.delta?`<div class="d ${p.delta<0?'neg':''}">${p.delta>0?'+':''}${p.delta}</div>`:''}<img class="av" src="${charImg(p.char)}" alt=""><div class="pillar" data-h="calc(var(--maxh) * ${(p.tower||0)/3})" style="height:0"></div><div class="lbl">${esc(p.name)} <span class="s" data-from="${opts.countFrom?p.score-p.delta:p.score}" data-to="${p.score}">${opts.countFrom?p.score-p.delta:p.score}</span></div></div>`).join('')}</div>`},
  patchReveal(){
    const S=this.S,tiles=document.querySelectorAll('.optlist .ans');
    if(S.curType==='rank'||S.curType==='fc'||tiles.length!==4)return this.render({countFrom:true});
    tiles.forEach((el,i)=>el.classList.add(i===S.correct?'hit':'dim'));
    const bar=document.getElementById('tbar');if(bar){bar.style.transform='scaleX(0)';bar.parentElement.classList.remove('hot')}
    this.renderPods({countFrom:true});document.querySelectorAll('.pod .s,.sb .s').forEach((el,i)=>setTimeout(()=>countUp(el,+el.dataset.from,+el.dataset.to,800),600+i*80));const sl=document.querySelector('.pslot');if(sl){sl.classList.add('on');Presenter.show(false)}
    const c=document.querySelector('.hostctl');if(c)c.outerHTML=this.ctl(S.qIdx>=S.nq-1?'Stand':'Volgende',autoMode?'':'Enter = volgende');
  },
  render(opts={}){
    const S=this.S,q=S.cur,t=S.curType,R=ROUNDS[t]||{},CH=CHANNELS[S.channel];
    const conn=this.conn==='SUBSCRIBED'?'':`<p class="err">Verbinding: ${esc(this.conn||'bezig…')}</p>`;
    if(S.phase==='lobby'){
      const ps=Object.values(S.players);
      app.innerHTML=`<div class="center"><div class="logo" style="font-size:2.2rem">BUZZ<small>QUIZ</small></div>
        <p class="muted" style="margin:0">Ga op je telefoon naar <b style="color:var(--fg)">${esc(location.host+location.pathname)}</b> en vul de code in</p>
        <div class="row" style="gap:24px"><div class="code">${S.code}</div><div class="qr" id="qr"></div></div>
        <div class="lobbyav">${ps.map(p=>`<div style="${p.online?'':'opacity:.4'}"><img src="${charImg(p.char)}" alt="">${esc(p.name)}</div>`).join('')||'<span class="muted">Nog geen spelers</span>'}</div>
        ${conn}
        <div class="row"><button class="btn" data-a="next" ${ps.length?'':'disabled'}>Start (${ps.length} spelers)</button><button class="btn ghost" data-a="quit">Annuleren</button></div>
        <p class="muted">${S.order.map(k=>ROUNDS[k].name).join(' · ')} · ${S.nq} vragen per ronde</p></div>`;
      try{new QRCode(document.getElementById('qr'),{text:joinUrl(S.code),width:140,height:140})}catch(e){}
      Presenter.hide();
    }
    else if(S.phase==='channel'||S.phase==='channelpick'){
      const ch=S.players[S.chooser];
      app.innerHTML=`<div class="host"><div class="topbar"><span class="rname">${esc(R.name)}<small>Ronde ${S.roundIdx+1}/${S.order.length}</small></span><span class="qn"></span><div class="timer"><i id="tbar"></i></div></div>
        <div class="stage3"><div class="chanpick" style="grid-template-columns:1fr 1fr">${Object.entries(CHANNELS).map(([k,c])=>`<div class="chan ${S.channel===k?'pick':''}" style="background:${c.color}">${esc(c.name)}</div>`).join('')}</div>
        <div class="mid"><div class="pslot on"></div><div class="focus" style="grid-column:auto">${ch?`<img class="closeup" src="${charImg(ch.char)}" alt="" style="height:min(34vh,260px);filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))"><div class="big" style="font-family:var(--display);font-size:clamp(1.3rem,3vw,2.2rem);color:var(--b3)">${S.phase==='channelpick'?esc(CH.name):esc(ch.name)+' kiest de zender…'}</div>`:'<p class="muted">Zender wordt gekozen…</p>'}</div></div>
        ${this.scoreboard()}</div>
        <div>${this.ctl('','Enter = willekeurig')}</div></div>`;
      Presenter.show(false);
    }
    else if(S.phase==='intro'){
      app.innerHTML=`<div class="overlay" style="background:radial-gradient(ellipse at 50% 30%,${R.color}55,rgba(18,11,46,.9) 60%)"><p class="muted">Ronde ${S.roundIdx+1} van ${S.order.length} · ${esc(CH?.name||'')}</p><h1 class="title">${esc(R.name)}</h1><p>${esc(R.desc)}</p><div id="cd" style="min-height:1em"></div>${this.ctl('Eerste vraag','Enter = overslaan')}</div>`;
      Presenter.show(true);
    }
    else if(S.phase==='scores'||S.phase==='podium'){
      const b=this.board(),order=S.phase==='scores'&&S.prevOrder.length?[...S.prevOrder.map(id=>S.players[id]).filter(Boolean),...b.filter(p=>!S.prevOrder.includes(p.id))]:b;
      const row=(p,i,sc)=>`<div class="r ${i===0?'top':''}" data-id="${p.id}"><span class="pos">${i+1}</span><img src="${charImg(p.char)}" alt=""><span>${esc(p.name)}</span><span class="sc">${sc}</span></div>`;
      app.innerHTML=`<div class="overlay">${S.phase==='podium'?`<h1 id="winner">Eindstand</h1><div class="podium">${b[1]?`<div class="p2"><img src="${charImg(b[1].char)}" alt="">${esc(b[1].name)}<b>${b[1].score}</b></div>`:''}${b[0]?`<div class="p1"><img src="${charImg(b[0].char)}" alt="">${esc(b[0].name)}<b>${b[0].score}</b></div>`:''}${b[2]?`<div class="p3"><img src="${charImg(b[2].char)}" alt="">${esc(b[2].name)}<b>${b[2].score}</b></div>`:''}</div>`:`<h1 class="title">Stand na ronde ${S.roundIdx+1}</h1>`}
        <div class="board">${S.phase==='scores'?order.map((p,i)=>row(p,i,S.roundStart[p.id]??p.score)).join(''):b.map((p,i)=>row(p,i,p.score)).join('')}</div>
        ${this.ctl(S.phase==='podium'?'Nieuw spel':(S.roundIdx>=S.order.length-1?'Uitslag':'Volgende ronde'))}</div>`;
      Presenter.show(true);
    }
    else{
      const rem=Math.max(0,S.timerEnd-Date.now()),frac=S.timerTotal?rem/S.timerTotal:0;
      let left,title=q?.q||'',cat=q?.cat||'',focus='';
      const opts4=()=>`<div class="optlist">${q.a.map((a,i)=>`<div class="ans c${i} ${S.phase==='reveal'?(i===S.correct?'hit':'dim'):''}"><span class="k">${KEYS[i]}</span><span>${esc(a)}</span></div>`).join('')}</div>`;
      if(S.phase==='bet'){title='Plaats je inzet: 100, 250 of 500';cat=R.name;left=`<div class="buzzstage"><div class="big">💰</div><p class="muted">${this.online().filter(p=>p.bet).length}/${this.online().length} hebben ingezet</p></div>`}
      else if(t==='rank'&&(S.phase==='reading'||S.phase==='rank'))left=`<div class="ranklist">${S.rankOrder.map((idx,i)=>`<div class="ri"><span class="k">${KEYS[i]}</span><span>${esc(q.items[idx])}</span></div>`).join('')}</div>`;
      else if(t==='rank'&&S.phase==='reveal')left=`<div class="ranklist">${q.items.map((it,i)=>`<div class="ri ok"><span class="k">${i+1}</span><span>${esc(it)}</span></div>`).join('')}</div>`;
      else if(S.phase==='reading')left=`<div class="buzzstage"><p class="muted">${t==='ps'?'Buzzers gaan zo open…':'Antwoorden komen zo…'}</p></div>`;
      else if(S.phase==='buzzing')left=`<div class="buzzstage"><div class="ring"></div><div class="big">BUZZ!</div><p class="muted">${this.eligible().length} mogen buzzen</p></div>`;
      else if(S.phase==='pie')left=`<div class="buzzstage"><div class="big">🥧</div><p class="muted">${S.throwers.map(id=>S.players[id]?.name).filter(Boolean).map(esc).join(', ')} kiezen een slachtoffer…</p></div>`;
      else left=opts4();
      if(S.phase==='buzzed'){const o=S.players[S.buzzOwner];focus=`<div class="focus"><img class="closeup" src="${charImg(o?.char)}" alt=""><div class="big slam" style="font-family:var(--display);font-size:clamp(1.6rem,5vw,3.2rem)">${esc(o?.name)}</div><p class="muted">kiest een antwoord…</p></div>`}
      else if(S.phase==='bombq'){const h=S.players[S.bomb?.holder];focus=`<div class="focus"><img class="closeup" src="${charImg(h?.char)}" alt=""><div class="big" style="font-family:var(--display);font-size:clamp(1.3rem,3.5vw,2.4rem);color:var(--b3)">💣 ${esc(h?.name)}</div><p class="muted">antwoordt op de telefoon…</p></div>`}
      const showP=['reading','reveal','pie'].includes(S.phase);
      const mid=t==='fc'&&S.phase!=='bombq'?`<div class="mid"><div class="pslot ${showP?'on':''}"></div>${this.towers(opts)}</div>`:focus?`<div class="mid">${focus}</div>`:`<div class="mid"><div class="pslot ${showP?'on':''}"></div>${this.pods(opts)}</div>`;
      const hint=S.phase==='reveal'?(autoMode?'':'Enter = volgende'):S.phase==='answer'?`${Object.keys(S.answers).length}/${this.online().filter(p=>!p.out).length} geantwoord`:S.phase==='reading'?'Enter = overslaan':'';
      app.innerHTML=`<div class="host">
        <div class="topbar"><span class="rname">${esc(R.name)}<small>${esc(CH?.name||'')}</small></span><span class="qn">${t==='bomb'?`Bom ${S.bomb?.n||1}/${S.bomb?.total||1}`:`Vraag ${S.qIdx+1}/${S.nq}`}</span><div class="timer"><i id="tbar" style="transform:scaleX(${S.phase==='reveal'||S.phase==='reading'?0:frac})"></i></div></div>
        <div class="qcard ${S.phase==='reading'?'reading':''}" style="animation:none"><div class="cat">${esc(cat)}</div><div class="q">${esc(title)}</div></div>
        <div class="stage3">${left}${mid}${this.scoreboard(opts)}</div>
        ${this.ctl(S.phase==='reveal'?(S.qIdx>=S.nq-1||S.finalDone?'Stand':'Volgende'):'',hint)}</div>`;
      document.querySelector('.host').style.gridTemplateRows='auto auto 1fr auto';
      if(showP)Presenter.show(false);else Presenter.hide();
      if(opts.countFrom)document.querySelectorAll('.pod .s,.sb .s,.tower .s').forEach((el,i)=>setTimeout(()=>countUp(el,+el.dataset.from,+el.dataset.to,800),600+i*80));
      if(t==='fc')requestAnimationFrame(()=>document.querySelectorAll('.tower .pillar').forEach(el=>{el.style.height=el.dataset.h}));
    }
    app.onclick=e=>{const a=e.target.closest('[data-a]')?.dataset.a;if(!a)return;audioInit();
      if(a==='next')this.next();else if(a==='sound'){soundOn=!soundOn;this.render()}else if(a==='voice'){voiceOn=!voiceOn;ls.set('buzz.voice',voiceOn);if(!voiceOn)Voice.stop();this.render()}else if(a==='fast'){fastMode=!fastMode;ls.set('buzz.fast',fastMode);if(fastMode)Voice.stop();this.render()}else if(a==='quit'){this.ch?.unsubscribe();ls.del('buzz.host');document.querySelector('.stage-bg')?.remove();Presenter.unmount();landing()}};
    document.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){if(e.target.tagName==='INPUT')return;e.preventDefault();audioInit();this.next()}};
  },
};

/* ================= PLAYER ================= */
const Player={
  pid:null,name:null,code:null,char:null,ch:null,S:null,sentFor:null,conn:null,wait:null,raf:null,rankSel:[],
  form(code){
    const saved=ls.get('buzz.player',{});
    app.innerHTML=`<div class="center"><div class="logo" style="font-size:2.2rem">BUZZ<small>QUIZ</small></div>
      <form class="stack" id="jf"><input id="jc" placeholder="Code (4 letters)" maxlength="4" autocapitalize="characters" autocomplete="off" value="${esc(code)}" style="text-align:center;font-family:var(--display);font-size:1.6rem;letter-spacing:.2em">
      <input id="jn" placeholder="Je naam" maxlength="16" autocomplete="off" value="${esc(saved.name||'')}">
      <p class="muted" style="margin:4px 0 0">Kies je kandidaat</p>
      <div class="chargrid" id="cg">${CHARS.map(([id,n])=>`<button type="button" data-ch="${id}" class="${(saved.char||'kees')===id?'me':''}"><img src="${charImg(id)}" alt="">${esc(n)}</button>`).join('')}</div>
      <button class="btn" type="submit">Meedoen</button><button class="btn ghost" type="button" data-a="back">Terug</button><p class="err" id="je"></p></form></div>`;
    let chosen=saved.char||'kees';
    document.getElementById('cg').onclick=e=>{const b=e.target.closest('[data-ch]');if(!b)return;chosen=b.dataset.ch;document.querySelectorAll('#cg button').forEach(x=>x.classList.toggle('me',x===b));vib(20)};
    document.getElementById('jf').onsubmit=e=>{e.preventDefault();audioInit();const c=document.getElementById('jc').value.trim().toUpperCase(),n=document.getElementById('jn').value.trim();
      if(c.length!==4||!n){document.getElementById('je').textContent='Vul een code van 4 letters en je naam in.';return}
      Player.join(c,n,saved.code===c?saved.pid:null,chosen)};
    app.onclick=e=>{if(e.target.closest('[data-a="back"]'))landing()};
  },
  join(code,name,pid,char){
    this.code=code;this.name=name;this.pid=pid||uid();this.char=char||'kees';ls.set('buzz.player',{code,name,pid:this.pid,char:this.char});
    this.ch=sb.channel('buzz:'+code,{config:{broadcast:{self:false},presence:{key:this.pid}}});
    this.ch.on('broadcast',{event:'state'},({payload:s})=>this.onState(s))
      .subscribe(st=>{this.conn=st;if(st==='SUBSCRIBED'){this.ch.track({pid:this.pid});this.send('join',{pid:this.pid,name,char:this.char});clearTimeout(this.wait);this.wait=setTimeout(()=>{if(!this.S){this.slow=true;this.render()}},4000)}this.render()});
    try{navigator.wakeLock?.request('screen').catch(()=>{})}catch(e){}
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){try{navigator.wakeLock?.request('screen').catch(()=>{})}catch(e){}this.send('hello',{pid:this.pid})}});
    this.render();
  },
  send(ev,payload){if(this.ch&&this.conn==='SUBSCRIBED')this.ch.send({type:'broadcast',event:ev,payload})},
  onState(s){if(!s||typeof s!=='object')return;const prev=this.S;this.S=s;this.tEnd=Date.now()+(s.timerMs||0);
    if(s.qKey!==prev?.qKey){this.sentFor=null;this.rankSel=[]}
    const me=this.me();if(me)this.char=me.char;
    if(prev&&s.phase==='reveal'&&prev.phase!=='reveal'&&me){if(me.status==='correct'){SFX.correct();vib([60,40,60]);document.body.classList.add('ok-flash')}else if(me.status==='wrong'){SFX.wrong();vib(300);document.body.classList.add('bad-flash')}setTimeout(()=>document.body.classList.remove('ok-flash','bad-flash'),700)}
    if(s.phase==='buzzed'&&s.buzzOwner===this.pid&&prev?.phase!=='buzzed')vib(120);
    if(s.phase==='bombq'&&s.bombHolder===this.pid&&prev?.bombHolder!==this.pid)vib([80,60,80]);
    if(s.phase==='pie'&&s.throwers?.includes(this.pid)&&prev?.phase!=='pie')vib(60);
    if(s.phase==='channel'&&s.chooser===this.pid&&prev?.phase!=='channel')vib(60);
    if((s.phase==='answer'||s.phase==='buzzing'||s.phase==='rank')&&prev?.phase==='reading')vib(30);
    const oldScore=prev?.players.find(p=>p.id===this.pid)?.score;
    this.render();
    if(me&&oldScore!=null&&oldScore!==me.score)countUp(document.querySelector('.hdr b'),oldScore,me.score,700)},
  me(){return this.S?.players.find(p=>p.id===this.pid)},
  answer(c){const S=this.S;if(!S||this.sentFor===S.qKey+':'+S.phase)return;this.sentFor=S.qKey+':'+S.phase;this.send('answer',{pid:this.pid,choice:c});vib(40);this.render()},
  buzz(){const S=this.S;if(!S||S.phase!=='buzzing')return;this.send('buzz',{pid:this.pid});vib(80);SFX.buzz()},
  render(){
    const S=this.S,me=this.me();
    const hdr=`<div class="hdr"><img src="${charImg(this.char)}" alt=""><div style="flex:1;min-width:0"><div>${esc(this.name)}</div><div class="st ${this.conn==='SUBSCRIBED'&&S?'on':''}">${this.conn==='SUBSCRIBED'?(S?'Verbonden · '+esc(S.code):'Wachten op host…'):'Verbinden…'}</div></div><b>${me?me.score:0}</b></div>`;
    let body;
    const pad=(enabled)=>`<div class="pad">${S.question.a.map((a,i)=>`<button class="c${i}" data-c="${i}" ${enabled?'':'disabled'}><span class="k">${KEYS[i]}</span>${esc(a)}</button>`).join('')}</div>`;
    const qt=()=>`<div class="qtext">${esc(S.question?.q||'')}</div><div class="ctimer"><i id="ctbar"></i></div>`;
    const others=()=>S.players.filter(p=>p.id!==this.pid&&p.online);
    if(!S){body=`<div class="msg"><h2>${this.conn==='SUBSCRIBED'?'Wachten op het spel':'Verbinden…'}</h2><p class="muted">${this.slow?'Nog geen antwoord van de host. Klopt de code? Het hostscherm moet open staan.':''}</p><button class="btn ghost" data-a="back">Terug</button></div>`}
    else if(!me){body=`<div class="msg"><h2>Niet toegelaten</h2><p class="muted">Het spel is vol (max 12) of al gestart.</p><button class="btn ghost" data-a="back">Terug</button></div>`}
    else if(S.phase==='lobby'){body=`<div class="msg"><img src="${charImg(me.char)}" style="height:160px" alt=""><h2>Je doet mee!</h2><p class="muted">Jij bent ${esc(CHARS.find(c=>c[0]===me.char)?.[1]||'')}. Wacht tot de host start. ${S.players.length} spelers in de lobby.</p></div>`}
    else if(S.phase==='channel'||S.phase==='channelpick'){
      if(S.chooser===this.pid&&S.phase==='channel')body=`<div class="msg" style="flex:0"><h2>Jij kiest de zender!</h2></div><div class="chanbtns">${Object.entries(CHANNELS).map(([k,c])=>`<button data-chan="${k}" style="background:${c.color}">${esc(c.name)}</button>`).join('')}</div>`;
      else{const ch=S.players.find(p=>p.id===S.chooser);body=`<div class="msg"><h2>${S.phase==='channelpick'?esc(CHANNELS[S.channel]?.name):'Zender'}</h2><p class="muted">${S.phase==='channelpick'?'Daar gaan we.':(ch?esc(ch.name)+' kiest de zender…':'Wachten…')}</p></div>`}}
    else if(S.phase==='intro'){body=`<div class="msg"><p class="muted">Ronde ${S.roundIdx+1}</p><h2>${esc(S.roundName)}</h2><p class="muted">${esc(S.roundDesc)}</p></div>`}
    else if(S.phase==='bet'){const sel=me.bet;body=`<div class="msg" style="flex:0"><h2>Zet in</h2><p class="muted">Vóór je de vraag ziet. Goed: erbij. Fout: eraf.</p></div><div class="bets">${[100,250,500].map(b=>`<button data-bet="${b}" class="${sel===b?'sel':''}">${b}</button>`).join('')}</div><div class="ctimer"><i id="ctbar"></i></div>`}
    else if(S.phase==='reading'){body=qt()+`<div class="msg"><h2 style="color:var(--muted)">Luister…</h2><p class="muted">${S.roundType==='ps'?'De buzzer gaat zo open.':'De antwoorden komen zo.'}</p></div>`}
    else if(S.phase==='answer'&&me.out){body=qt()+`<div class="msg"><h2 style="color:var(--bad)">Uitgeschakeld</h2><p class="muted">Je toren is gevallen. Kijk mee.</p></div>`}
    else if(S.phase==='answer'){body=qt()+(me.status==='answered'||this.sentFor===S.qKey+':answer'?`<div class="msg"><h2>Ingediend</h2><p class="muted">Wachten op de rest…</p></div>`:pad(true))}
    else if(S.phase==='rank'){const sent=me.status==='answered'||this.sentFor===S.qKey+':rank';const items=S.question.items||[];
      body=qt()+(sent?`<div class="msg"><h2>Ingediend</h2></div>`:`<p class="muted" style="margin:0;text-align:center">Tik in de juiste volgorde (1 → 4)</p><div class="list">${items.map((it,i)=>{const pos=this.rankSel.indexOf(i);return `<button data-ri="${i}" class="${pos>=0?'sel':''}"><span class="k">${pos>=0?pos+1:KEYS[i]}</span>${esc(it)}</button>`}).join('')}</div><button class="btn ghost sm" data-a="rankreset">Opnieuw</button>`)}
    else if(S.phase==='buzzing'){const locked=me.status==='wrong';body=qt()+`<div class="buzzer"><button id="bz" ${locked?'disabled':''}>${locked?'FOUT':'BUZZ'}</button></div>`}
    else if(S.phase==='buzzed'){const owner=S.players.find(p=>p.id===S.buzzOwner);body=qt()+(S.buzzOwner===this.pid?pad(this.sentFor!==S.qKey+':buzzed'):`<div class="msg"><img src="${charImg(owner?.char)}" style="height:120px" alt=""><h2>${esc(owner?.name)}</h2><p class="muted">heeft gebuzzd en antwoordt…</p></div>`)}
    else if(S.phase==='bombq'){const h=S.players.find(p=>p.id===S.bombHolder);body=qt()+(S.bombHolder===this.pid?pad(this.sentFor!==S.qKey+':bombq'):`<div class="msg"><div style="font-size:3rem">💣</div><h2>${esc(h?.name)}</h2><p class="muted">heeft de bom. Hopelijk blijft hij daar.</p></div>`)}
    else if(S.phase==='pie'){if(S.throwers?.includes(this.pid)&&!this.sentFor?.endsWith(':pie')){body=`<div class="msg" style="flex:0"><h2>🥧 Gooi een taart!</h2><p class="muted">Kies je slachtoffer (−100)</p></div><div class="list">${others().map(p=>`<button data-pie="${p.id}"><img src="${charImg(p.char)}" alt="">${esc(p.name)} <span class="muted">${p.score}</span></button>`).join('')}</div>`}
      else body=`<div class="msg"><div style="font-size:3rem">🥧</div><h2>Taarten vliegen</h2><p class="muted">${S.throwers?.includes(this.pid)?'Taart onderweg…':'Hopelijk niet naar jou.'}</p></div>`}
    else if(S.phase==='reveal'){const ok=me.status==='correct';const isRank=S.roundType==='rank';body=`<div class="msg"><h2 style="color:${ok?'var(--ok)':me.status==='wrong'?'var(--bad)':'var(--muted)'}">${me.status==='out'?'Uitgeschakeld':ok?'Goed!':me.status==='wrong'?'Fout':me.status==='answered'?'Deels goed':'Geen antwoord'}</h2>${S.roundType==='fc'&&!me.out?`<p class="muted">Toren: ${'█'.repeat(me.tower)}${'░'.repeat(3-me.tower)}</p>`:''}<div class="delta ${me.delta<0?'neg':''}">${me.delta>0?'+':''}${me.delta||0}</div>${isRank&&S.rankTruth?`<p class="muted">Juiste volgorde: ${S.rankTruth.map(esc).join(' → ')}</p>`:S.correct!=null&&S.question?`<p class="muted">Antwoord: ${KEYS[S.correct]} · ${esc(S.question.a[S.correct])}</p>`:''}</div>`}
    else if(S.phase==='scores'||S.phase==='podium'){const b=S.players.slice().sort((a,b)=>b.score-a.score),pos=b.findIndex(p=>p.id===this.pid)+1;body=`<div class="msg"><p class="muted">${S.phase==='podium'?'Eindstand':'Tussenstand'}</p><h2>${pos}e plaats</h2><div class="board">${b.map((p,i)=>`<div class="r ${i===0?'top':''}"><span class="pos">${i+1}</span><img src="${charImg(p.char)}" alt=""><span>${esc(p.name)}</span><span class="sc">${p.score}</span></div>`).join('')}</div>${S.phase==='podium'?'<button class="btn ghost" data-a="back">Klaar</button>':''}</div>`}
    else body=`<div class="msg"><h2>…</h2></div>`;
    app.innerHTML=`<div class="ctl">${hdr}<div class="body">${body}</div></div>`;
    app.onclick=e=>{audioInit();const b=e.target.closest('button');if(!b)return;const S=this.S;
      if(b.dataset.c!=null)this.answer(+b.dataset.c);
      else if(b.id==='bz')this.buzz();
      else if(b.dataset.chan){this.send('channel',{pid:this.pid,channel:b.dataset.chan});vib(40)}
      else if(b.dataset.bet){this.send('bet',{pid:this.pid,bet:+b.dataset.bet});vib(40);document.querySelectorAll('.bets button').forEach(x=>x.classList.toggle('sel',x===b))}
      else if(b.dataset.ri!=null){const i=+b.dataset.ri;if(this.rankSel.includes(i))return;this.rankSel.push(i);vib(20);if(this.rankSel.length===4){this.sentFor=S.qKey+':rank';this.send('rank',{pid:this.pid,order:this.rankSel})}this.render()}
      else if(b.dataset.a==='rankreset'){this.rankSel=[];this.render()}
      else if(b.dataset.pie){this.sentFor=S.qKey+':pie';this.send('pie',{pid:this.pid,target:b.dataset.pie});vib(60);this.render()}
      else if(b.dataset.a==='back'){this.ch?.unsubscribe();landing()}};
    cancelAnimationFrame(this.raf);const bar=document.getElementById('ctbar');
    if(bar&&S?.timerTotal){const tick=()=>{const r=Math.max(0,this.tEnd-Date.now());bar.style.transform=`scaleX(${r/S.timerTotal})`;if(r>0)this.raf=requestAnimationFrame(tick)};tick()}
  },
};

if(params.get('c'))Player.form(params.get('c').toUpperCase());else landing();
</script>
