<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#120b2e">
<title>Buzz Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: één scherm, geen scroll. Host = podium (vraag midden, spelersbalk onder). Controller = duimbereik (knoppen onderin). */
:root{
  --bg:#120b2e; --panel:#1d1446; --panel2:#271b5c; --line:#3b2d7a;
  --fg:#f6f1ff; --muted:#a899d6; --accent:#ff3d8a;
  --b0:#2f7bff; --b1:#ff7a1a; --b2:#2ecc71; --b3:#ffd400; --buzz:#ff2d2d;
  --ok:#2ecc71; --bad:#ff5252;
  --display:'Bungee','Impact',sans-serif; --body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-weight:600;-webkit-tap-highlight-color:transparent;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--b3);outline-offset:2px}
input{font:inherit;font-weight:800;color:var(--fg);background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:14px 16px;width:100%}
.btn{background:var(--accent);color:#fff;font-family:var(--display);font-size:1.1rem;padding:16px 28px;border-radius:14px;box-shadow:0 6px 0 #a3104f;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a3104f}
.btn.ghost{background:var(--panel2);box-shadow:0 6px 0 #0d0822}
.btn.ghost:active{box-shadow:0 2px 0 #0d0822}
.btn.sm{font-size:.85rem;padding:10px 14px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.on{outline:3px solid var(--b3)}
.muted{color:var(--muted)}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding-block:24px}
.stack{display:flex;flex-direction:column;gap:14px;width:min(100%,420px)}
.logo{font-family:var(--display);font-size:clamp(2.6rem,9vw,5rem);line-height:1;color:var(--b3);text-shadow:0 .06em 0 var(--accent)}
.logo small{display:block;font-size:.3em;color:var(--fg);text-shadow:none;letter-spacing:.3em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.chip{background:var(--panel2);border-radius:999px;padding:8px 14px;font-weight:800;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.chip.off{opacity:.45;text-decoration:line-through}
.code{font-family:var(--display);font-size:clamp(3rem,14vw,7rem);letter-spacing:.12em;line-height:1;color:var(--b3)}
.qr{background:#fff;padding:10px;border-radius:12px;display:inline-block}
.qr img,.qr canvas{display:block}
label.opt{display:flex;gap:10px;align-items:center;background:var(--panel2);padding:10px 14px;border-radius:12px;text-align:left}
label.opt input{width:22px;height:22px;accent-color:var(--accent)}
label.opt span{flex:1}
label.opt small{color:var(--muted)}
.err{color:var(--bad)}

/* Studio-achtergrond: video indien aanwezig, anders CSS-lichtbundels */
.stage-bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(ellipse at 50% 120%,#3a1670 0%,var(--bg) 60%)}
.stage-bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.stage-bg .beam{position:absolute;left:50%;top:-20%;width:18vw;height:160%;transform-origin:50% 0;background:linear-gradient(180deg,rgba(255,61,138,.28),rgba(255,61,138,0) 70%);filter:blur(18px);mix-blend-mode:screen;animation:sweep 9s ease-in-out infinite alternate}
.stage-bg .beam.b2{background:linear-gradient(180deg,rgba(255,212,0,.22),rgba(255,212,0,0) 70%);animation-duration:11s;animation-delay:-4s}
.stage-bg .beam.b3{background:linear-gradient(180deg,rgba(47,123,255,.22),rgba(47,123,255,0) 70%);animation-duration:13s;animation-delay:-8s}
.stage-bg .floor{position:absolute;left:0;right:0;bottom:0;height:28%;background:linear-gradient(0deg,rgba(255,61,138,.18),transparent)}
@keyframes sweep{from{transform:translateX(-50%) rotate(-28deg)}to{transform:translateX(-50%) rotate(28deg)}}

/* Host game screen */
.host{flex:1;min-height:0;display:grid;grid-template-rows:auto 1fr auto;gap:14px;padding-block:14px}
.topbar{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center}
.topbar .rname{font-family:var(--display);font-size:1.1rem;color:var(--b3)}
.topbar .qn{color:var(--muted);font-weight:800}
.timer{grid-column:1/-1;height:10px;background:var(--panel);border-radius:999px;overflow:hidden}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--b3));width:100%;transform-origin:left;transition:transform .25s linear}
.timer.hot i{background:linear-gradient(90deg,var(--buzz),var(--b1));animation:pulse .5s infinite alternate}
@keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.6)}}
.stage{display:grid;grid-template-rows:auto 1fr;gap:16px;min-height:0}
.qcard{background:rgba(29,20,70,.92);border-radius:20px;padding:clamp(16px,3vw,32px);display:flex;flex-direction:column;gap:10px;justify-content:center;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:slideup .6s cubic-bezier(.2,1.3,.4,1)}
.qcard .cat{color:var(--accent);font-weight:900;letter-spacing:.15em;text-transform:uppercase;font-size:.8rem}
.qcard .q{font-size:clamp(1.4rem,3.6vw,2.6rem);font-weight:900;line-height:1.2}
.qcard.reading .q{animation:glow 1.4s ease-in-out infinite alternate}
@keyframes glow{from{text-shadow:0 0 0 rgba(255,212,0,0)}to{text-shadow:0 0 24px rgba(255,212,0,.5)}}
@keyframes slideup{from{transform:translateY(60px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0;perspective:1200px}
@media (max-width:640px){.answers{grid-template-columns:1fr}}
.ans{border-radius:18px;padding:16px 20px;display:flex;align-items:center;gap:14px;font-size:clamp(1.1rem,2.4vw,1.8rem);font-weight:900;color:#0d0822;min-height:64px;transition:opacity .5s,transform .5s,filter .5s;animation:flipin .7s cubic-bezier(.2,1.2,.4,1) both}
.ans:nth-child(1){animation-delay:.05s}.ans:nth-child(2){animation-delay:.2s}.ans:nth-child(3){animation-delay:.35s}.ans:nth-child(4){animation-delay:.5s}
@keyframes flipin{from{transform:rotateX(-90deg) translateY(20px);opacity:0}to{transform:none;opacity:1}}
.ans .k{font-family:var(--display);font-size:1.2em;opacity:.8}
.ans.c0{background:var(--b0);color:#fff}.ans.c1{background:var(--b1)}.ans.c2{background:var(--b2);color:#0b2e1a}.ans.c3{background:var(--b3)}
.ans.dim{opacity:.18;transform:scale(.94) rotateX(25deg);filter:grayscale(.6);animation:none}
.ans.hit{outline:6px solid #fff;animation:hit .9s cubic-bezier(.2,1.5,.4,1) both;box-shadow:0 0 60px rgba(255,255,255,.5)}
@keyframes hit{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1.04)}}
.buzzstage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(29,20,70,.9);border-radius:20px;padding:20px;text-align:center;animation:slideup .5s cubic-bezier(.2,1.3,.4,1)}
.buzzstage .big{font-family:var(--display);font-size:clamp(1.6rem,5vw,3.4rem);color:var(--b3)}
.buzzstage .big.slam{animation:slam .6s cubic-bezier(.2,1.6,.3,1) both;color:#fff;text-shadow:0 0 40px var(--buzz)}
@keyframes slam{0%{transform:scale(4);opacity:0}60%{transform:scale(.92);opacity:1}80%{transform:scale(1.06) rotate(-1deg)}100%{transform:scale(1)}}
.buzzstage .ring{width:140px;height:140px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7b7b,var(--buzz) 60%,#9c0a0a);box-shadow:0 0 0 0 rgba(255,45,45,.6);animation:ring 1.2s ease-out infinite}
@keyframes ring{to{box-shadow:0 0 0 40px rgba(255,45,45,0)}}
.players{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;padding-top:14px}
.pl{flex:1 1 120px;min-width:120px;background:rgba(29,20,70,.92);border-radius:14px;padding:10px 12px;display:grid;gap:4px;border:3px solid transparent;position:relative;font-variant-numeric:tabular-nums;transition:border-color .3s,box-shadow .3s,transform .3s}
.pl .n{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .s{font-family:var(--display);font-size:1.3rem}
.pl.answered{border-color:var(--muted)}
.pl.buzzed{border-color:var(--buzz);box-shadow:0 0 24px rgba(255,45,45,.5);transform:translateY(-4px)}
.pl.correct{border-color:var(--ok);box-shadow:0 0 24px rgba(46,204,113,.45)}.pl.wrong{border-color:var(--bad)}.pl.locked{opacity:.4}
.pl.offline .n::after{content:' · offline';color:var(--bad);font-weight:600;font-size:.8em}
.pl .d{position:absolute;top:-14px;right:8px;font-family:var(--display);font-size:1rem;padding:2px 8px;border-radius:8px;background:var(--ok);color:#06291a;animation:popup .7s cubic-bezier(.2,1.6,.4,1) both}
.pl .d.neg{background:var(--bad);color:#fff}
@keyframes popup{from{transform:translateY(16px) scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.hostctl{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hostctl .hint{color:var(--muted);font-size:.9rem}
.overlay{position:fixed;inset:0;background:rgba(18,11,46,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:24px;z-index:5;animation:fade .5s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.overlay h1{font-size:clamp(2rem,7vw,4.5rem);color:var(--b3)}
.overlay h1.title{animation:titlein 1s cubic-bezier(.2,1.4,.3,1) both;text-shadow:0 .05em 0 var(--accent),0 0 40px rgba(255,212,0,.4)}
@keyframes titlein{0%{transform:scale(.2) rotate(-6deg);opacity:0;letter-spacing:.6em}70%{transform:scale(1.08);opacity:1;letter-spacing:.02em}100%{transform:scale(1)}}
.overlay p{max-width:36ch;font-size:1.2rem;margin:0;animation:fade .8s .6s both}
.count{font-family:var(--display);font-size:clamp(4rem,16vw,10rem);color:#fff;line-height:1;animation:countin .9s ease-out both}
@keyframes countin{0%{transform:scale(2.4);opacity:0}30%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:.2}}
.board{display:grid;gap:8px;width:min(100%,520px);position:relative}
.board .r{display:grid;grid-template-columns:2.2rem 1fr auto;gap:12px;align-items:center;background:var(--panel);padding:12px 16px;border-radius:12px;font-size:1.2rem;font-weight:900;font-variant-numeric:tabular-nums;text-align:left;transition:transform .9s cubic-bezier(.2,1.1,.3,1),background .5s}
.board .r.top{background:var(--accent)}
.board .r.up .sc{color:var(--ok)}.board .r.down .sc{color:var(--bad)}
.board .r .pos{font-family:var(--display)}
.board .r .sc{font-family:var(--display)}
.podium{display:flex;align-items:flex-end;gap:12px;justify-content:center;height:240px}
.podium div{width:120px;background:var(--panel2);border-radius:12px 12px 0 0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:10px;gap:6px;font-weight:900;transform-origin:bottom;transform:scaleY(0);opacity:0;transition:transform .9s cubic-bezier(.2,1.3,.4,1),opacity .3s}
.podium div.show{opacity:1;transform:none}
.podium .p1{height:220px;background:var(--b3);color:#0d0822}.podium .p2{height:170px}.podium .p3{height:130px}
.podium b{font-family:var(--display);font-size:1.6rem}
@keyframes rise{from{transform:scaleY(0);opacity:0}to{transform:none;opacity:1}}
.flash{position:fixed;inset:0;z-index:6;pointer-events:none;background:var(--buzz);animation:flashout .7s ease-out both}
@keyframes flashout{from{opacity:.85}to{opacity:0}}
.shake{animation:shake .5s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.vidover{position:fixed;inset:0;z-index:7;background:#000;display:flex;align-items:center;justify-content:center}
.vidover video{width:100%;height:100%;object-fit:cover}
#confetti{position:fixed;inset:0;z-index:8;pointer-events:none}
.winner{font-size:clamp(2.4rem,9vw,6rem)!important;animation:titlein 1.2s cubic-bezier(.2,1.4,.3,1) both}

/* Controller */
.ctl{flex:1;min-height:0;display:grid;grid-template-rows:auto 1fr;gap:12px;padding-block:12px}
.ctl .hdr{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border-radius:12px;padding:10px 14px}
.ctl .hdr b{font-family:var(--display);font-size:1.2rem;font-variant-numeric:tabular-nums}
.ctl .hdr .st{font-size:.75rem;color:var(--muted)}
.ctl .hdr .st.on{color:var(--ok)}
.ctl .body{display:flex;flex-direction:column;gap:12px;min-height:0}
.ctl .msg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:10px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.ctl .msg h2{font-size:clamp(1.5rem,7vw,2.4rem)}
.ctl .msg .delta{font-family:var(--display);font-size:3rem;color:var(--ok);animation:popup .6s cubic-bezier(.2,1.6,.4,1) both}
.ctl .msg .delta.neg{color:var(--bad)}
.ctl .qtext{background:var(--panel);border-radius:14px;padding:14px;text-align:center;font-weight:900;font-size:1.05rem;animation:slideup .4s cubic-bezier(.2,1.3,.4,1)}
.pad{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;flex:1;min-height:0}
.pad button{border-radius:20px;font-size:1.05rem;font-weight:900;color:#0d0822;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.18);transition:transform .08s;animation:flipin .5s cubic-bezier(.2,1.2,.4,1) both}
.pad button:nth-child(2){animation-delay:.08s}.pad button:nth-child(3){animation-delay:.16s}.pad button:nth-child(4){animation-delay:.24s}
.pad button:active{transform:scale(.96)}
.pad button[disabled]{opacity:.35}
.pad .c0{background:var(--b0);color:#fff}.pad .c1{background:var(--b1)}.pad .c2{background:var(--b2)}.pad .c3{background:var(--b3)}
.pad button .k{font-family:var(--display);font-size:1.6rem;opacity:.75}
.buzzer{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.buzzer button{width:min(78vw,340px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7b7b,var(--buzz) 60%,#9c0a0a);box-shadow:0 18px 0 #6b0000,0 30px 40px rgba(0,0,0,.5);font-family:var(--display);font-size:2.4rem;color:#fff;text-shadow:0 3px 0 #7a0000;transition:transform .06s,box-shadow .06s;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.buzzer button:active{transform:translateY(14px);box-shadow:0 4px 0 #6b0000,0 10px 20px rgba(0,0,0,.5)}
.buzzer button[disabled]{filter:grayscale(.8);opacity:.5}
.ctimer{height:8px;background:var(--panel);border-radius:999px;overflow:hidden}
.ctimer i{display:block;height:100%;background:var(--accent);transform-origin:left}
body.ok-flash{animation:okflash .6s}
body.bad-flash{animation:badflash .6s}
@keyframes okflash{0%{background:#1e7a45}100%{background:var(--bg)}}
@keyframes badflash{0%{background:#8a1c1c}100%{background:var(--bg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function tone(f,t,type='sine',g=.25,at=0){if(!AC||!soundOn)return;const o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.value=f;v.gain.value=0;o.connect(v);v.connect(AC.destination);const s=AC.currentTime+at;v.gain.setValueAtTime(0,s);v.gain.linearRampToValueAtTime(g,s+.01);v.gain.exponentialRampToValueAtTime(.001,s+t);o.start(s);o.stop(s+t+.05)}

/* ---------- Presentator (vooraf gegenereerde clips, fallback browser-TTS) ---------- */
const Voice={cache:{},cur:null,
  load(k){if(!this.cache[k]){const a=new Audio(MEDIA+'voice/'+k+'.mp3');a.preload='auto';this.cache[k]=a}return this.cache[k]},
  preload(...ks){ks.forEach(k=>k&&this.load(k))},
  say(k,fallback){
    if(!voiceOn||!k||fastMode)return Promise.resolve();
    return new Promise(res=>{const a=this.load(k);let done=false;const fin=()=>{if(done)return;done=true;if(this.cur===a){this.cur=null;this.curFin=null}res()};
      this.stop();this.cur=a;this.curFin=fin;try{a.currentTime=0}catch(e){}
      a.onended=fin;
      a.onerror=()=>{if(fallback&&'speechSynthesis' in window){try{const u=new SpeechSynthesisUtterance(fallback);u.lang='nl-NL';u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);return}catch(e){}}fin()};
      const p=a.play();if(p&&p.catch)p.catch(()=>a.onerror());
      setTimeout(fin,25000)})},
  stop(){const f=this.curFin;if(this.cur){try{this.cur.pause()}catch(e){}this.cur.onended=null;this.cur=null}this.curFin=null;try{speechSynthesis.cancel()}catch(e){}if(f)f()},
  pick(prefix,n){return prefix+(1+Math.floor(Math.random()*n))},
};
/* ---------- Confetti ---------- */
function confetti(ms=6000){const c=document.createElement('canvas');c.id='confetti';document.body.appendChild(c);const x=c.getContext('2d');const W=c.width=innerWidth,H=c.height=innerHeight;const cols=['#ff3d8a','#ffd400','#2f7bff','#2ecc71','#ff7a1a','#fff'];const P=Array.from({length:220},()=>({x:Math.random()*W,y:-20-Math.random()*H,vx:(Math.random()-.5)*2,vy:2+Math.random()*4,r:4+Math.random()*6,c:cols[Math.random()*cols.length|0],a:Math.random()*6,va:(Math.random()-.5)*.3}));const t0=Date.now();(function f(){x.clearRect(0,0,W,H);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;if(p.y>H+20){p.y=-20;p.x=Math.random()*W}x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(Date.now()-t0<ms)requestAnimationFrame(f);else c.remove()})()}
function countUp(el,from,to,ms=700){if(!el)return;const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-k,3);el.textContent=Math.round(from+(to-from)*e);if(k<1)requestAnimationFrame(f)})(t0)}

/* ---------- Routing ---------- */
const params=new URLSearchParams(location.search);
const joinUrl=code=>location.origin+location.pathname+'?c='+code;
function landing(){
  const saved=ls.get('buzz.player',null), savedHost=ls.get('buzz.host',null);
  app.innerHTML=`<div class="center">
    <div class="logo">BUZZ<small>QUIZ</small></div>
    <div class="stack">
      ${savedHost&&savedHost.phase!=='podium'?`<button class="btn" data-a="resume">Hervat spel ${esc(savedHost.code)}</button>`:''}
      <button class="btn" data-a="host">Nieuw spel (TV / laptop)</button>
      <button class="btn ghost" data-a="join">Meedoen (telefoon)</button>
      ${saved?`<button class="btn ghost" data-a="rejoin">Terug als ${esc(saved.name)} in ${esc(saved.code)}</button>`:''}
    </div>
    <p class="muted">Eén scherm host het spel, iedereen speelt mee op z’n telefoon.</p>
  </div>`;
  app.onclick=e=>{const a=e.target.closest('[data-a]')?.dataset.a;if(!a)return;audioInit();
    if(a==='host')Host.setup();else if(a==='resume')Host.resume(savedHost);else if(a==='join')Player.form(params.get('c')||'');else if(a==='rejoin')Player.join(saved.code,saved.name,saved.pid)};
}

/* ================= HOST ================= */
const Host={
  S:null,ch:null,timer:null,tickTimer:null,seq:0,run:0,
  setup(){
    app.innerHTML=`<div class="center"><h1 style="color:var(--b3)">Nieuw spel</h1>
      <div class="stack">
        ${Object.entries(ROUNDS).map(([k,r])=>`<label class="opt"><input type="checkbox" id="r_${k}" checked><span>${esc(r.name)}<br><small>${esc(r.desc)}</small></span></label>`).join('')}
        <label class="opt"><span>Vragen per ronde</span><input type="number" id="nq" value="5" min="3" max="10" style="width:80px"></label>
        <label class="opt"><input type="checkbox" id="o_voice" ${voiceOn?'checked':''}><span>Presentator (stem)</span></label>
        <label class="opt"><input type="checkbox" id="o_auto" ${autoMode?'checked':''}><span>Automatisch doorgaan<br><small>Uit = host drukt Enter na elke vraag</small></span></label>
        <button class="btn" data-a="create">Open de lobby</button>
        <button class="btn ghost" data-a="back">Terug</button>
      </div></div>`;
    app.onclick=e=>{const a=e.target.closest('[data-a]')?.dataset.a;if(!a)return;
      if(a==='back')return landing();
      const order=Object.keys(ROUNDS).filter(k=>document.getElementById('r_'+k).checked);
      if(!order.length)return;
      const nq=Math.max(3,Math.min(10,+document.getElementById('nq').value||5));
      voiceOn=document.getElementById('o_voice').checked;ls.set('buzz.voice',voiceOn);
      autoMode=document.getElementById('o_auto').checked;ls.set('buzz.auto',autoMode);
      Host.create(order,nq)};
  },
  create(order,nq){
    const code=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*23|0]).join('');
    this.S={code,order,nq,phase:'lobby',players:{},plan:null,roundIdx:0,qIdx:-1,answers:{},buzzOwner:null,locked:[],timerEnd:0,timerTotal:0,qStart:0,correct:null,roundStart:{},prevOrder:[]};
    this.connect();this.render();this.bg();Voice.preload('start','countdown');Voice.say('welcome');
  },
  resume(S){this.S=S;S.roundStart=S.roundStart||{};S.prevOrder=S.prevOrder||[];if(['reading','answer','buzzing','buzzed'].includes(S.phase)){S.phase='reveal';S.correct=this.curQ()?.c??null;S.buzzOwner=null;S.timerEnd=0;Object.values(S.players).forEach(p=>{p.status='none';p.delta=0})}Object.values(S.players).forEach(p=>p.online=false);this.connect();this.render();this.bg()},
  bg(){ // studio-achtergrond: video als media/video/studio.mp4 bestaat, anders CSS-lichtbundels
    if(document.querySelector('.stage-bg'))return;
    const d=document.createElement('div');d.className='stage-bg';d.innerHTML=`<i class="beam"></i><i class="beam b2"></i><i class="beam b3"></i><i class="floor"></i>`;
    const v=document.createElement('video');v.muted=true;v.loop=true;v.autoplay=true;v.playsInline=true;v.src=MEDIA+'video/studio.mp4';v.onerror=()=>v.remove();v.oncanplay=()=>{v.play().catch(()=>{})};d.appendChild(v);
    document.body.prepend(d);
  },
  playClip(src,ms){ // fullscreen videoclip; slaat over als het bestand ontbreekt
    if(fastMode)return Promise.resolve();
    return new Promise(res=>{const d=document.createElement('div');d.className='vidover';const v=document.createElement('video');v.muted=true;v.playsInline=true;v.autoplay=true;v.src=src;let done=false;const fin=()=>{if(done)return;done=true;d.remove();res()};
      v.onerror=fin;v.onended=fin;v.oncanplay=()=>{v.play().catch(fin);setTimeout(fin,ms||6000)};d.appendChild(v);document.body.appendChild(d);setTimeout(()=>{if(v.readyState<2)fin()},4000)})},
  connect(){
    const S=this.S;
    this.ch=sb.channel('buzz:'+S.code,{config:{broadcast:{self:false,ack:false},presence:{key:'host'}}});
    this.ch.on('broadcast',{event:'join'},({payload:p})=>this.onJoin(p))
      .on('broadcast',{event:'hello'},()=>this.push())
      .on('broadcast',{event:'buzz'},({payload:p})=>this.onBuzz(p))
      .on('broadcast',{event:'answer'},({payload:p})=>this.onAnswer(p,Date.now()))
      .on('presence',{event:'leave'},({leftPresences})=>{leftPresences.forEach(x=>{const pl=S.players[x.pid];if(pl){pl.online=false;this.render();this.push()}})})
      .on('presence',{event:'join'},({newPresences})=>{newPresences.forEach(x=>{const pl=S.players[x.pid];if(pl&&!pl.online){pl.online=true;this.render();this.push()}})})
      .subscribe(st=>{this.conn=st;if(st==='SUBSCRIBED'){this.ch.track({host:true});this.push()}this.render()});
  },
  onJoin(p){
    if(!p||!p.pid||typeof p.name!=='string')return;const S=this.S;
    const name=p.name.trim().slice(0,16)||'Speler';
    if(!S.players[p.pid]){if(Object.keys(S.players).length>=12)return;S.players[p.pid]={id:p.pid,name,score:0,delta:0,status:'idle',online:true};SFX.join()}
    else{S.players[p.pid].name=name;S.players[p.pid].online=true}
    if(S.phase==='lobby')this.render();this.push();
  },
  pub(){
    const S=this.S,q=this.curQ();
    return {seq:++this.seq,code:S.code,phase:S.phase,roundIdx:S.roundIdx,roundType:S.order[S.roundIdx],roundName:ROUNDS[S.order[S.roundIdx]]?.name,roundDesc:ROUNDS[S.order[S.roundIdx]]?.desc,
      qIdx:S.qIdx,qTotal:S.nq,qKey:S.roundIdx*100+S.qIdx,question:q?{q:q.q,a:q.a,cat:q.cat}:null,correct:S.phase==='reveal'?S.correct:null,
      players:Object.values(S.players).map(p=>({id:p.id,name:p.name,score:p.score,delta:p.delta,status:p.status,online:p.online})),
      buzzOwner:S.buzzOwner,timerMs:Math.max(0,S.timerEnd-Date.now()),timerTotal:S.timerTotal};
  },
  push(){if(this.ch&&this.conn==='SUBSCRIBED')this.ch.send({type:'broadcast',event:'state',payload:this.pub()});ls.set('buzz.host',this.S)},
  curQ(){const S=this.S;return S.plan?.[S.roundIdx]?.[S.qIdx]||null},
  nextQ(){const S=this.S;return S.plan?.[S.roundIdx]?.[S.qIdx+1]||S.plan?.[S.roundIdx+1]?.[0]||null},
  buildPlan(){
    const S=this.S,used=new Set(ls.get('buzz.used',[]));
    let pool=QUESTIONS.filter(q=>!used.has(q.q));if(pool.length<S.order.length*S.nq){pool=QUESTIONS.slice();used.clear()}
    pool=shuffle(pool);const plan=[];
    for(const t of S.order){
      let pick;
      if(t==='fc'){pick=pool.filter(q=>q.d>=2).slice(0,S.nq)}else{pick=pool.slice(0,S.nq)}
      if(pick.length<S.nq)pick=pool.slice(0,S.nq);
      pool=pool.filter(q=>!pick.includes(q));plan.push(pick);pick.forEach(q=>used.add(q.q));
    }
    ls.set('buzz.used',[...used].slice(-200));S.plan=plan;
  },
  /* --- regie: elke fase is een scène met animatie + stem; Enter breekt de scène af en gaat door --- */
  async next(){
    const S=this.S;this.run++;Voice.stop();
    if(S.phase==='lobby'){if(!Object.keys(S.players).length)return;this.buildPlan();S.roundIdx=0;S.qIdx=-1;this.enterIntro()}
    else if(S.phase==='intro'){this.ask()}
    else if(S.phase==='reading'){this.open()}
    else if(S.phase==='reveal'){if(S.qIdx>=S.nq-1||S.qIdx>=S.plan[S.roundIdx].length-1)this.enterScores();else this.ask()}
    else if(S.phase==='scores'){if(S.roundIdx>=S.order.length-1)this.enterPodium();else{S.roundIdx++;S.qIdx=-1;this.enterIntro()}}
    else if(S.phase==='podium'){ls.del('buzz.host');document.querySelector('.stage-bg')?.remove();return landing()}
  },
  async enterIntro(){
    const S=this.S,run=++this.run,t=S.order[S.roundIdx];S.phase='intro';
    Object.values(S.players).forEach(p=>{p.delta=0;p.status='idle'});
    S.roundStart={};Object.values(S.players).forEach(p=>S.roundStart[p.id]=p.score);
    S.prevOrder=Object.values(S.players).sort((a,b)=>b.score-a.score).map(p=>p.id);
    this.push();
    if(S.roundIdx===0)await Voice.say('start');if(run!==this.run)return;
    await this.playClip(MEDIA+'video/stinger_'+t+'.mp4',5000);if(run!==this.run)return;
    SFX.whoosh();this.render();
    const q0=S.plan[S.roundIdx][0];Voice.preload('intro_'+t,'q_'+q0.v,'a_'+q0.v);
    await Voice.say('intro_'+t,ROUNDS[t].name+'. '+ROUNDS[t].desc);if(run!==this.run)return;
    if(!autoMode)return this.render();
    await this.countdown(run);if(run!==this.run)return;
    this.ask();
  },
  async countdown(run){
    const el=document.getElementById('cd');if(!el||fastMode)return;
    Voice.say('countdown');
    for(const n of [3,2,1]){if(run!==this.run)return;el.innerHTML=`<div class="count">${n}</div>`;SFX.countTick();await wait(900)}
    if(run!==this.run)return;SFX.countGo();
  },
  async ask(){
    const S=this.S,run=++this.run;S.qIdx++;const t=S.order[S.roundIdx],q=this.curQ();
    S.answers={};S.buzzOwner=null;S.locked=[];S.correct=null;Object.values(S.players).forEach(p=>{p.delta=0;p.status='idle'});
    this.stopTimer();S.phase='reading';S.timerTotal=0;this.render();this.push();
    const nq=this.nextQ();Voice.preload('q_'+q.v,'a_'+q.v,nq&&'q_'+nq.v,nq&&'a_'+nq.v);
    SFX.whoosh();await wait(fastMode?200:500);if(run!==this.run)return;
    await Voice.say('q_'+q.v,q.q);if(run!==this.run)return;
    this.open();
  },
  open(){ // antwoorden/buzzers vrijgeven, timer start
    const S=this.S,t=S.order[S.roundIdx];this.run++;
    S.phase=t==='ps'?'buzzing':'answer';S.qStart=Date.now();
    for(let i=0;i<4;i++)setTimeout(()=>SFX.flip(),120*i);
    this.startTimer(ROUNDS[t].time,()=>t==='ps'?this.reveal('nobuzz'):this.endAnswer());
  },
  startTimer(ms,fn){
    const S=this.S;clearTimeout(this.timer);clearInterval(this.tickTimer);S.timerEnd=Date.now()+ms;S.timerTotal=ms;
    this.timer=setTimeout(fn,ms);
    this.tickTimer=setInterval(()=>{const r=S.timerEnd-Date.now();if(r<3200&&r>0&&Math.floor(r/1000)!==Math.floor((r+250)/1000))SFX.tick();const el=document.getElementById('tbar');if(el){el.style.transform=`scaleX(${Math.max(0,r/S.timerTotal)})`;el.parentElement.classList.toggle('hot',r<3200)}if(r<=0)clearInterval(this.tickTimer)},250);
    this.render();this.push();
  },
  stopTimer(){clearTimeout(this.timer);clearInterval(this.tickTimer);this.S.timerEnd=0},
  eligible(){const S=this.S;return Object.values(S.players).filter(p=>p.online&&!S.locked.includes(p.id))},
  onBuzz(p){
    const S=this.S;if(S.phase!=='buzzing'||!p||!S.players[p.pid]||S.locked.includes(p.pid))return;
    S.buzzOwner=p.pid;S.players[p.pid].status='buzzed';S.phase='buzzed';SFX.buzz();
    const f=document.createElement('div');f.className='flash';document.body.appendChild(f);setTimeout(()=>f.remove(),800);app.classList.add('shake');setTimeout(()=>app.classList.remove('shake'),600);
    Voice.say(Voice.pick('buzz',3));
    this.startTimer(8000,()=>this.judgeBuzz(-1));
  },
  judgeBuzz(choice){
    const S=this.S,q=this.curQ(),pl=S.players[S.buzzOwner];if(!pl)return this.reveal();
    if(choice===q.c){pl.score+=300;pl.delta=300;pl.status='correct';SFX.correct();return this.reveal('ok')}
    pl.score-=100;pl.delta=-100;pl.status='wrong';S.locked.push(pl.id);SFX.wrong();S.buzzOwner=null;
    const left=this.eligible();
    if(!left.length)return this.reveal('bad');
    S.phase='buzzing';Voice.say(Voice.pick('buzzbad',2));this.startTimer(8000,()=>this.reveal('nobuzz'));
  },
  onAnswer(p,now){
    const S=this.S;if(!p||!S.players[p.pid])return;const c=+p.choice;if(!(c>=0&&c<=3))return;
    if(S.phase==='answer'){if(S.answers[p.pid]!=null)return;S.answers[p.pid]={c,t:now};S.players[p.pid].status='answered';SFX.flip();
      const waiting=Object.values(S.players).filter(x=>x.online&&S.answers[x.id]==null);
      if(!waiting.length)return this.endAnswer();this.renderPlayers();this.push()}
    else if(S.phase==='buzzed'&&p.pid===S.buzzOwner){this.judgeBuzz(c)}
  },
  endAnswer(){
    const S=this.S,q=this.curQ(),t=S.order[S.roundIdx],T=ROUNDS[t].time;let anyOk=false,anyAns=false;
    Object.values(S.players).forEach(pl=>{const a=S.answers[pl.id];let d=0;
      if(!a){pl.status='none'}
      else if(a.c===q.c){pl.status='correct';anyOk=anyAns=true;const frac=Math.max(0,1-(a.t-S.qStart)/T);d=t==='pb'?150:t==='ff'?100+Math.round(400*frac):100+Math.round(300*frac)}
      else{pl.status='wrong';anyAns=true;d=t==='fc'?-200:0}
      pl.delta=d;pl.score+=d});
    this.reveal(anyOk?'ok':anyAns?'bad':'nobody');
  },
  async reveal(kind){
    const S=this.S,run=++this.run,q=this.curQ();this.stopTimer();S.correct=q.c;S.phase='reveal';
    Object.values(S.players).forEach(p=>{if(p.status==='idle'||p.status==='answered'||p.status==='buzzed')p.status='none'});S.buzzOwner=null;
    if(kind==='nobuzz'&&Object.values(S.players).some(p=>p.status==='correct'))kind='ok';
    SFX.reveal();this.patchReveal();this.push();
    await wait(fastMode?300:900);if(run!==this.run)return;
    if(kind==='nobuzz'){await Voice.say('nobuzz');if(run!==this.run)return}
    await Voice.say('a_'+q.v,'Het juiste antwoord is '+q.a[q.c]);if(run!==this.run)return;
    const quip=kind==='ok'?Voice.pick('ok',4):kind==='bad'?Voice.pick('bad',3):kind==='nobody'?Voice.pick('nobody',2):null;
    if(quip){await Voice.say(quip)}if(run!==this.run)return;
    if(!autoMode){this.render();return}
    await wait(fastMode?600:1800);if(run!==this.run)return;
    this.next();
  },
  async enterScores(){
    const S=this.S,run=++this.run;S.phase='scores';Object.values(S.players).forEach(p=>{p.delta=0;p.status='idle'});this.render();this.push();
    const last=S.roundIdx>=S.order.length-1;
    await wait(300);if(run!==this.run)return;
    await Voice.say(last?'final_intro':'scores');if(run!==this.run)return;
    await wait(1200);if(run!==this.run)return;
    this.flipBoard();await wait(1500);if(run!==this.run)return;
    if(!autoMode)return;
    await wait(last?1500:3500);if(run!==this.run)return;
    this.next();
  },
  flipBoard(){ // FLIP: rijen van oude volgorde naar nieuwe, scores tellen op
    const S=this.S,b=this.board(),rows=[...document.querySelectorAll('.board .r')];if(!rows.length)return;
    const before={};rows.forEach(r=>before[r.dataset.id]=r.getBoundingClientRect().top);
    const box=rows[0].parentElement;b.forEach((p,i)=>{const r=rows.find(x=>x.dataset.id===p.id);if(!r)return;box.appendChild(r);r.querySelector('.pos').textContent=i+1;r.classList.toggle('top',i===0);
      const from=S.roundStart[p.id]??p.score;if(p.score>from)r.classList.add('up');else if(p.score<from)r.classList.add('down');countUp(r.querySelector('.sc'),from,p.score,1200)});
    rows.forEach(r=>{const dy=before[r.dataset.id]-r.getBoundingClientRect().top;if(dy){r.style.transition='none';r.style.transform=`translateY(${dy}px)`;requestAnimationFrame(()=>{r.style.transition='';r.style.transform=''})}});
    SFX.whoosh();
  },
  async enterPodium(){
    const S=this.S,run=++this.run;S.phase='podium';this.render();this.push();
    const b=this.board(),el=n=>document.querySelector('.podium .p'+n);
    await wait(500);if(run!==this.run)return;
    if(b[2]){el(3)?.classList.add('show');SFX.flip();await wait(1400);if(run!==this.run)return}
    if(b[1]){el(2)?.classList.add('show');SFX.flip();await wait(1400);if(run!==this.run)return}
    await Voice.say('winner');if(run!==this.run)return;
    SFX.drum();await wait(fastMode?300:1800);if(run!==this.run)return;
    el(1)?.classList.add('show');const w=document.getElementById('winner');if(w){w.textContent='Winnaar: '+(b[0]?.name||'—');w.classList.add('winner')}
    SFX.fanfare();confetti(8000);
    await wait(800);if(run!==this.run)return;
    await Voice.say('congrats');
  },
  board(){return Object.values(this.S.players).sort((a,b)=>b.score-a.score)},
  ctl(label,hint){return `<div class="hostctl"><span class="hint">${hint||''}</span><span class="row"><button class="btn ghost sm" data-a="voice">${voiceOn?'🎙️ stem':'🎙️ uit'}</button><button class="btn ghost sm" data-a="sound">${soundOn?'🔊':'🔇'}</button><button class="btn ghost sm ${fastMode?'on':''}" data-a="fast">⏩ snel</button>${label?`<button class="btn" data-a="next">${label}</button>`:''}</span></div>`},
  renderPlayers(){const S=this.S,el=document.querySelector('.players');if(!el)return;el.innerHTML=this.pchips();},
  patchReveal(){ // reveal in-place zodat tegels wegdraaien i.p.v. opnieuw renderen
    const S=this.S,tiles=document.querySelectorAll('.answers .ans');
    if(tiles.length!==4)return this.render({countFrom:true});
    tiles.forEach((el,i)=>el.classList.add(i===S.correct?'hit':'dim'));
    const bar=document.getElementById('tbar');if(bar){bar.style.transform='scaleX(0)';bar.parentElement.classList.remove('hot')}
    const pl=document.querySelector('.players');if(pl){pl.innerHTML=this.pchips({countFrom:true});pl.querySelectorAll('.s').forEach((el,i)=>setTimeout(()=>countUp(el,+el.dataset.from,+el.dataset.to,800),600+i*80))}
    const c=document.querySelector('.hostctl');if(c)c.outerHTML=this.ctl(S.qIdx>=S.nq-1?'Stand':'Volgende',autoMode?'':'Enter = volgende');
  },
  pchips(opts={}){const S=this.S;return Object.values(S.players).map(p=>`<div class="pl ${p.status} ${p.online?'':'offline'}"><div class="n">${esc(p.name)}</div><div class="s" data-from="${opts.countFrom?p.score-p.delta:p.score}" data-to="${p.score}">${opts.countFrom?p.score-p.delta:p.score}</div>${p.delta?`<div class="d ${p.delta<0?'neg':''}">${p.delta>0?'+':''}${p.delta}</div>`:''}</div>`).join('')},
  render(opts={}){
    const S=this.S,q=this.curQ(),t=S.order[S.roundIdx],R=ROUNDS[t];
    const conn=this.conn==='SUBSCRIBED'?'':`<p class="err">Verbinding: ${esc(this.conn||'bezig…')}</p>`;
    if(S.phase==='lobby'){
      app.innerHTML=`<div class="center"><div class="logo" style="font-size:2.4rem">BUZZ<small>QUIZ</small></div>
        <p class="muted" style="margin:0">Ga op je telefoon naar <b style="color:var(--fg)">${esc(location.host+location.pathname)}</b> en vul de code in</p>
        <div class="code">${S.code}</div><div class="qr" id="qr"></div>
        <div class="row">${Object.values(S.players).map(p=>`<span class="chip ${p.online?'':'off'}">${esc(p.name)}</span>`).join('')||'<span class="muted">Nog geen spelers</span>'}</div>
        ${conn}
        <div class="row"><button class="btn" data-a="next" ${Object.keys(S.players).length?'':'disabled'}>Start (${Object.keys(S.players).length} spelers)</button><button class="btn ghost" data-a="quit">Annuleren</button></div>
        <p class="muted">${S.order.map(k=>ROUNDS[k].name).join(' · ')} · ${S.nq} vragen per ronde</p></div>`;
      try{new QRCode(document.getElementById('qr'),{text:joinUrl(S.code),width:160,height:160})}catch(e){}
    }
    else if(S.phase==='intro'){
      app.innerHTML=`<div class="overlay" style="background:radial-gradient(ellipse at 50% 30%,${R.color}55,rgba(18,11,46,.9) 60%)"><p class="muted">Ronde ${S.roundIdx+1} van ${S.order.length}</p><h1 class="title">${esc(R.name)}</h1><p>${esc(R.desc)}</p><div id="cd" style="min-height:1em"></div>${this.ctl('Eerste vraag','Enter = overslaan')}</div>`;
    }
    else if(S.phase==='scores'||S.phase==='podium'){
      const b=this.board(),order=S.phase==='scores'&&S.prevOrder.length?[...S.prevOrder.map(id=>S.players[id]).filter(Boolean),...b.filter(p=>!S.prevOrder.includes(p.id))]:b;
      app.innerHTML=`<div class="overlay">${S.phase==='podium'?`<h1 id="winner">Eindstand</h1><div class="podium">${b[1]?`<div class="p2">${esc(b[1].name)}<b>${b[1].score}</b></div>`:''}${b[0]?`<div class="p1">${esc(b[0].name)}<b>${b[0].score}</b></div>`:''}${b[2]?`<div class="p3">${esc(b[2].name)}<b>${b[2].score}</b></div>`:''}</div>`:`<h1 class="title">Stand na ronde ${S.roundIdx+1}</h1>`}
        ${S.phase==='scores'?`<div class="board">${order.map((p,i)=>`<div class="r ${i===0?'top':''}" data-id="${p.id}"><span class="pos">${i+1}</span><span>${esc(p.name)}</span><span class="sc">${S.roundStart[p.id]??p.score}</span></div>`).join('')}</div>`:`<div class="board">${b.map((p,i)=>`<div class="r ${i===0?'top':''}"><span class="pos">${i+1}</span><span>${esc(p.name)}</span><span class="sc">${p.score}</span></div>`).join('')}</div>`}
        ${this.ctl(S.phase==='podium'?'Nieuw spel':(S.roundIdx>=S.order.length-1?'Uitslag':'Volgende ronde'))}</div>`;
    }
    else{
      const rem=Math.max(0,S.timerEnd-Date.now()),frac=S.timerTotal?rem/S.timerTotal:0;
      let stage;
      const ansTiles=()=>`<div class="answers">${q.a.map((a,i)=>`<div class="ans c${i} ${S.phase==='reveal'?(i===S.correct?'hit':'dim'):''}"><span class="k">${KEYS[i]}</span><span>${esc(a)}</span></div>`).join('')}</div>`;
      if(S.phase==='reading')stage=`<div class="buzzstage"><p class="muted">${t==='ps'?'Buzzers gaan zo open…':'Antwoorden komen zo…'}</p></div>`;
      else if(S.phase==='buzzing')stage=`<div class="buzzstage"><div class="ring"></div><div class="big">BUZZ!</div><p class="muted">${this.eligible().length} spelers mogen buzzen</p></div>`;
      else if(S.phase==='buzzed')stage=`<div class="buzzstage"><div class="big slam">${esc(S.players[S.buzzOwner]?.name)}</div><p>kiest een antwoord op de telefoon…</p></div>`;
      else stage=ansTiles();
      const hint=S.phase==='reveal'?(autoMode?'':'Enter = volgende'):S.phase==='answer'?`${Object.keys(S.answers).length}/${Object.values(S.players).filter(p=>p.online).length} geantwoord`:S.phase==='reading'?'Enter = overslaan':'';
      app.innerHTML=`<div class="host">
        <div class="topbar"><span class="rname">${esc(R.name)}</span><span class="qn">Vraag ${S.qIdx+1}/${S.nq}</span><div class="timer"><i id="tbar" style="transform:scaleX(${S.phase==='reveal'||S.phase==='reading'?0:frac})"></i></div></div>
        <div class="stage"><div class="qcard ${S.phase==='reading'?'reading':''}"><div class="cat">${esc(q.cat)}</div><div class="q">${esc(q.q)}</div></div>${stage}</div>
        <div><div class="players">${this.pchips(opts)}</div>${this.ctl(S.phase==='reveal'?(S.qIdx>=S.nq-1?'Stand':'Volgende'):'',hint)}</div></div>`;
      if(opts.countFrom)document.querySelectorAll('.pl .s').forEach((el,i)=>setTimeout(()=>countUp(el,+el.dataset.from,+el.dataset.to,800),600+i*80));
    }
    app.onclick=e=>{const a=e.target.closest('[data-a]')?.dataset.a;if(!a)return;audioInit();
      if(a==='next')this.next();else if(a==='sound'){soundOn=!soundOn;this.render()}else if(a==='voice'){voiceOn=!voiceOn;ls.set('buzz.voice',voiceOn);if(!voiceOn)Voice.stop();this.render()}else if(a==='fast'){fastMode=!fastMode;ls.set('buzz.fast',fastMode);if(fastMode)Voice.stop();this.render()}else if(a==='quit'){this.ch?.unsubscribe();ls.del('buzz.host');document.querySelector('.stage-bg')?.remove();landing()}};
    document.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){if(e.target.tagName==='INPUT')return;e.preventDefault();audioInit();this.next()}};
  },
};

/* ================= PLAYER ================= */
const Player={
  pid:null,name:null,code:null,ch:null,S:null,sentFor:null,conn:null,wait:null,raf:null,
  form(code){
    app.innerHTML=`<div class="center"><div class="logo" style="font-size:2.4rem">BUZZ<small>QUIZ</small></div>
      <form class="stack" id="jf"><input id="jc" placeholder="Code (4 letters)" maxlength="4" autocapitalize="characters" autocomplete="off" value="${esc(code)}" style="text-align:center;font-family:var(--display);font-size:1.6rem;letter-spacing:.2em">
      <input id="jn" placeholder="Je naam" maxlength="16" autocomplete="off" value="${esc(ls.get('buzz.player',{}).name||'')}">
      <button class="btn" type="submit">Meedoen</button><button class="btn ghost" type="button" data-a="back">Terug</button><p class="err" id="je"></p></form></div>`;
    document.getElementById('jf').onsubmit=e=>{e.preventDefault();audioInit();const c=document.getElementById('jc').value.trim().toUpperCase(),n=document.getElementById('jn').value.trim();
      if(c.length!==4||!n){document.getElementById('je').textContent='Vul een code van 4 letters en je naam in.';return}
      const saved=ls.get('buzz.player',{});Player.join(c,n,saved.code===c?saved.pid:null)};
    app.onclick=e=>{if(e.target.closest('[data-a="back"]'))landing()};
    (code?document.getElementById('jn'):document.getElementById('jc')).focus();
  },
  join(code,name,pid){
    this.code=code;this.name=name;this.pid=pid||uid();ls.set('buzz.player',{code,name,pid:this.pid});
    this.ch=sb.channel('buzz:'+code,{config:{broadcast:{self:false},presence:{key:this.pid}}});
    this.ch.on('broadcast',{event:'state'},({payload:s})=>this.onState(s))
      .subscribe(st=>{this.conn=st;if(st==='SUBSCRIBED'){this.ch.track({pid:this.pid});this.send('join',{pid:this.pid,name});clearTimeout(this.wait);this.wait=setTimeout(()=>{if(!this.S){this.slow=true;this.render()}},4000)}this.render()});
    try{navigator.wakeLock?.request('screen').catch(()=>{})}catch(e){}
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){try{navigator.wakeLock?.request('screen').catch(()=>{})}catch(e){}this.send('hello',{pid:this.pid})}});
    this.render();
  },
  send(ev,payload){if(this.ch&&this.conn==='SUBSCRIBED')this.ch.send({type:'broadcast',event:ev,payload})},
  onState(s){if(!s||typeof s!=='object')return;const prev=this.S;this.S=s;this.tEnd=Date.now()+(s.timerMs||0);
    if(s.qKey!==prev?.qKey)this.sentFor=null;
    const me=this.me();
    if(prev&&s.phase==='reveal'&&prev.phase!=='reveal'&&me){if(me.status==='correct'){SFX.correct();vib([60,40,60]);document.body.classList.add('ok-flash')}else if(me.status==='wrong'){SFX.wrong();vib(300);document.body.classList.add('bad-flash')}setTimeout(()=>document.body.classList.remove('ok-flash','bad-flash'),700)}
    if(s.phase==='buzzed'&&s.buzzOwner===this.pid&&prev?.phase!=='buzzed')vib(120);
    if((s.phase==='answer'||s.phase==='buzzing')&&prev?.phase==='reading')vib(30);
    const oldScore=prev?.players.find(p=>p.id===this.pid)?.score;
    this.render();
    if(me&&oldScore!=null&&oldScore!==me.score)countUp(document.querySelector('.hdr b'),oldScore,me.score,700)},
  me(){return this.S?.players.find(p=>p.id===this.pid)},
  answer(c){const S=this.S;if(!S||this.sentFor===S.qKey+':'+S.phase)return;this.sentFor=S.qKey+':'+S.phase;this.send('answer',{pid:this.pid,choice:c});vib(40);this.render()},
  buzz(){const S=this.S;if(!S||S.phase!=='buzzing')return;this.send('buzz',{pid:this.pid});vib(80);SFX.buzz()},
  render(){
    const S=this.S,me=this.me();
    const hdr=`<div class="hdr"><div><div>${esc(this.name)}</div><div class="st ${this.conn==='SUBSCRIBED'&&S?'on':''}">${this.conn==='SUBSCRIBED'?(S?'Verbonden · '+esc(S.code):'Wachten op host…'):'Verbinden…'}</div></div><b>${me?me.score:0}</b></div>`;
    let body;
    const pad=(enabled)=>`<div class="pad">${S.question.a.map((a,i)=>`<button class="c${i}" data-c="${i}" ${enabled?'':'disabled'}><span class="k">${KEYS[i]}</span>${esc(a)}</button>`).join('')}</div>`;
    const qt=()=>`<div class="qtext">${esc(S.question.q)}</div><div class="ctimer"><i id="ctbar"></i></div>`;
    if(!S){body=`<div class="msg"><h2>${this.conn==='SUBSCRIBED'?'Wachten op het spel':'Verbinden…'}</h2><p class="muted">${this.slow?'Nog geen antwoord van de host. Klopt de code? Het hostscherm moet open staan.':''}</p><button class="btn ghost" data-a="back">Terug</button></div>`}
    else if(!me){body=`<div class="msg"><h2>Niet toegelaten</h2><p class="muted">Het spel is vol (max 12) of al gestart.</p><button class="btn ghost" data-a="back">Terug</button></div>`}
    else if(S.phase==='lobby'){body=`<div class="msg"><h2>Je doet mee!</h2><p class="muted">Wacht tot de host start. ${S.players.length} spelers in de lobby.</p></div>`}
    else if(S.phase==='intro'){body=`<div class="msg"><p class="muted">Ronde ${S.roundIdx+1}</p><h2>${esc(S.roundName)}</h2><p class="muted">${esc(S.roundDesc)}</p></div>`}
    else if(S.phase==='reading'){body=qt()+`<div class="msg"><h2 style="color:var(--muted)">Luister…</h2><p class="muted">${S.roundType==='ps'?'De buzzer gaat zo open.':'De antwoorden komen zo.'}</p></div>`}
    else if(S.phase==='answer'){body=qt()+(me.status==='answered'||this.sentFor===S.qKey+':answer'?`<div class="msg"><h2>Ingediend</h2><p class="muted">Wachten op de rest…</p></div>`:pad(true))}
    else if(S.phase==='buzzing'){const locked=me.status==='wrong';body=qt()+`<div class="buzzer"><button id="bz" ${locked?'disabled':''}>${locked?'FOUT':'BUZZ'}</button></div>`}
    else if(S.phase==='buzzed'){const owner=S.players.find(p=>p.id===S.buzzOwner);body=qt()+(S.buzzOwner===this.pid?pad(this.sentFor!==S.qKey+':buzzed'):`<div class="msg"><h2>${esc(owner?.name)}</h2><p class="muted">heeft gebuzzd en antwoordt…</p></div>`)}
    else if(S.phase==='reveal'){const ok=me.status==='correct';body=`<div class="msg"><h2 style="color:${ok?'var(--ok)':me.status==='wrong'?'var(--bad)':'var(--muted)'}">${ok?'Goed!':me.status==='wrong'?'Fout':'Geen antwoord'}</h2><div class="delta ${me.delta<0?'neg':''}">${me.delta>0?'+':''}${me.delta||0}</div><p class="muted">Antwoord: ${KEYS[S.correct]} · ${esc(S.question.a[S.correct])}</p></div>`}
    else if(S.phase==='scores'||S.phase==='podium'){const b=S.players.slice().sort((a,b)=>b.score-a.score),pos=b.findIndex(p=>p.id===this.pid)+1;body=`<div class="msg"><p class="muted">${S.phase==='podium'?'Eindstand':'Tussenstand'}</p><h2>${pos}e plaats</h2><div class="board">${b.map((p,i)=>`<div class="r ${i===0?'top':''}"><span class="pos">${i+1}</span><span>${esc(p.name)}</span><span class="sc">${p.score}</span></div>`).join('')}</div>${S.phase==='podium'?'<button class="btn ghost" data-a="back">Klaar</button>':''}</div>`}
    app.innerHTML=`<div class="ctl">${hdr}<div class="body">${body}</div></div>`;
    app.onclick=e=>{audioInit();const b=e.target.closest('button');if(!b)return;
      if(b.dataset.c!=null)this.answer(+b.dataset.c);else if(b.id==='bz')this.buzz();else if(b.dataset.a==='back'){this.ch?.unsubscribe();landing()}};
    cancelAnimationFrame(this.raf);const bar=document.getElementById('ctbar');
    if(bar&&S?.timerTotal){const tick=()=>{const r=Math.max(0,this.tEnd-Date.now());bar.style.transform=`scaleX(${r/S.timerTotal})`;if(r>0)this.raf=requestAnimationFrame(tick)};tick()}
  },
};

if(params.get('c'))Player.form(params.get('c').toUpperCase());else landing();
</script>
